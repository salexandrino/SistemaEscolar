<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro interno - Kutuar Educação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background-color:#f8f9fa;">
<div class="text-center px-3">
    <h1 class="display-3 fw-bold text-danger">500</h1>
    <p class="fs-5 mb-1">Ocorreu um erro interno inesperado.</p>
    <p class="text-muted" th:if="${message}" th:text="${message}">-</p>
    <a href="/hub" class="btn btn-primary mt-3">Voltar ao início</a>
</div>
</body>
</html>

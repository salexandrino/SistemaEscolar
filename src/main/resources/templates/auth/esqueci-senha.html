<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNGE - Recuperar Senha</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/home.css">

    <style>
        .form-label {
            color: #333;
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }
        .form-control {
            font-size: 0.9rem;
            padding: 0.6rem 0.75rem;
            border-color: #dee2e6;
        }
        .form-control::placeholder {
            color: #adb5bd;
        }
    </style>
</head>

<body class="login-container bg-light">
<div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">

        <div class="col-md-5 d-none d-md-flex flex-column justify-content-center text-center p-5 login-panel-left" style="background-color: #004B1C; position: sticky; top: 0; height: 100vh;">
            <div class="d-flex flex-column align-items-center">
                <img src="/images/logo.png" alt="SYNGE Logo" class="img-fluid mb-4" style="max-width: 65%; height: auto;">
                <p class="lead fw-medium px-4 mt-2" style="color: rgba(255,255,255,0.9); font-size: 1.15rem; line-height: 1.6;">
                    "Crie sua conta e experimente a plataforma definitiva para gestão de escolas."
                </p>
            </div>
        </div>

        <div class="col-md-7 d-flex flex-column justify-content-center p-4 p-md-5 bg-white">
            <div class="mx-auto w-100" style="max-width: 450px;">

                <div class="d-flex align-items-center mb-4 pb-2">
                    <div class="bg-success bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px;">
                        <i class="bi bi-key-fill text-success fs-3"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-0" style="color: #1a1a1a;">Esqueceu sua senha?</h3>
                        <p class="text-muted small mb-0">Informe seu e-mail para gerar um código de acesso.</p>
                    </div>
                </div>

                <div id="alertError" class="alert alert-danger border-0 rounded-2 small py-2 mb-3 d-none">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span id="textError"></span>
                </div>
                <div id="alertSuccess" class="alert alert-success border-0 rounded-2 small py-2 mb-3 d-none">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span id="textSuccess"></span>
                </div>

                <form id="forgotPasswordForm" class="needs-validation" novalidate>

                    <div class="mb-4">
                        <label for="email" class="form-label fw-bold">E-mail Cadastrado <span class="text-danger">*</span></label>
                        <input type="email" class="form-control rounded-2" id="email" name="email" placeholder="exemplo@synge.com" required autofocus>
                        <div class="invalid-feedback">Insira um e-mail válido.</div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-3 rounded-2 shadow-sm" style="background-color: #1a7332; border-color: #1a7332;">
                        Enviar Código
                    </button>

                    <div class="d-flex align-items-center mb-3">
                        <hr class="flex-grow-1">
                        <span class="mx-3 text-muted small">ou</span>
                        <hr class="flex-grow-1">
                    </div>

                    <a href="/login" class="btn btn-outline-secondary w-100 fw-bold py-2 rounded-2">
                        <i class="bi bi-arrow-left me-2"></i> Voltar para Login
                    </a>
                </form>
                <div class="text-center mt-5 pt-3 border-top" style="border-color: #f1f3f5 !important;">
                    <p class="text-muted mb-0" style="font-size: 0.75rem; letter-spacing: 0.5px;">
                        &copy; 2026 <strong>SYNGE</strong>. Gestão Escolar Inteligente.
                    </p>
                </div>

            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        event.stopPropagation();

        const form = this;
        const emailInput = document.getElementById('email');
        const alertError = document.getElementById('alertError');
        const alertSuccess = document.getElementById('alertSuccess');
        const textError = document.getElementById('textError');
        const textSuccess = document.getElementById('textSuccess');

        // Reseta estados dos alertas
        alertError.classList.add('d-none');
        alertSuccess.classList.add('d-none');

        if (!form.checkValidity()) {
            form.classList.add('was-validated');
            return;
        }

        form.classList.add('was-validated');

        // Cria o payload JSON exatamente como o ForgotPasswordDTO espera
        const payload = {
            email: emailInput.value
        };

        try {
            const response = await fetch('/auth/forgot-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                textSuccess.textContent = data.message || "Código enviado com sucesso!";
                alertSuccess.classList.remove('d-none');
                form.reset();
                form.classList.remove('was-validated');
            } else {
                textError.textContent = data.message || "Erro ao processar a solicitação.";
                alertError.classList.remove('0', 'd-none');
            }
        } catch (error) {
            textError.textContent = "Ocorreu um erro de rede. Tente novamente mais tarde.";
            alertError.classList.remove('d-none');
        }
    });
</script>
</body>
</html>

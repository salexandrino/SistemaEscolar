<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNGE - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="${'/css/style.css'}">
    <link rel="stylesheet" th:href="${'/css/home.css'}">
</head>
<body class="login-container">
<div class="container-fluid p-0">

    <div class="row g-0 min-vh-100">


        <!-- PAINEL INSTITUCIONAL -->

        <div class="col-md-5
                d-none d-md-flex
                flex-column
                justify-content-center
                align-items-center
                text-center
                p-5
                login-panel-left">
            <img
                    th:src="${'/images/logo.png'}"
                    alt="SYNGE Logo"
                    class="login-logo mb-3">

            <p class="fst-italic login-slogan">
                "A tecnologia conectando educação e resultados."
            </p>
        </div>
        <!-- FORMULÁRIO -->
        <div class="col-md-7
                d-flex
                justify-content-center
                align-items-center
                p-4">


            <div class="w-100 login-form-wrapper">


            <span class="eyebrow">

                04. Autenticação

            </span>



                <h2 class="fw-bold mt-3">

                    Acesse sua conta

                </h2>



                <p class="hero-subtitle">

                    Insira suas credenciais para acessar o sistema.

                </p>





                <!-- ERRO DO BACKEND -->

                <div th:if="${error}" class="alert alert-danger">
                    <span th:text="${error}">CPF ou senha inválidos.</span>
                </div>





                <form
                        th:action="${'/auth/login'}"
                        method="POST"
                        class="needs-validation"
                        novalidate>

                    <!-- CPF -->

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            CPF
                        </label>

                        <input
                                type="text"
                                                        id="cpf"
                                                        name="cpf"
                                                        class="form-control form-control-lg"
                                                        placeholder="000.000.000-00"
                                                        maxlength="14"
                                                        inputmode="numeric"
                                                        required>

                        <div class="invalid-feedback">
                            Informe seu CPF.
                        </div>

                    </div>


                    <!-- SENHA -->

                    <div class="mb-4">

                        <div class="d-flex justify-content-between">

                            <label class="form-label fw-bold">
                                Senha
                            </label>

                            <a href="/esqueci-senha" class="text-decoration-none small text-success fw-bold">
                                Esqueceu sua senha?
                            </a>

                        </div>

                        <input
                                type="password"
                                name="senha"
                                class="form-control form-control-lg"
                                required>

                        <div class="invalid-feedback">
                            Informe sua senha.
                        </div>

                    </div>


                    <button
                            type="submit"
                            class="btn btn-success btn-lg w-100 fw-bold">

                        Entrar

                    </button>

                    <div class="text-center mt-3">

                        <span class="text-muted">
                            Não tem uma conta?
                        </span>

                        <a th:href="${'/cadastro'}"
                           class="text-success fw-bold text-decoration-none">

                            Cadastre-se

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



<script>


    document.addEventListener('DOMContentLoaded', () => {
        const cpfInput = document.getElementById('cpf');
        if (cpfInput) {
            cpfInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                let formatted = '';
                if (value.length > 0) formatted = value.substring(0, 3);
                if (value.length > 3) formatted += '.' + value.substring(3, 6);
                if (value.length > 6) formatted += '.' + value.substring(6, 9);
                if (value.length > 9) formatted += '-' + value.substring(9, 11);
                e.target.value = formatted;
            });
        }

        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                const cpfValue = document.getElementById('cpf').value || '';
                const cpfDigits = cpfValue.replace(/\D/g, '');
                function isValidCpfNumber(str) {
                                    return str.length === 11;
                                }

                if (cpfDigits.length !== 11) {
                    // Evita envio e marca invalidez no campo CPF para feedback nativo
                    document.getElementById('cpf').setCustomValidity('CPF inválido.');
                    event.preventDefault();
                    event.stopPropagation();
                    form.classList.add('was-validated');
                    return;
                } else {
                    document.getElementById('cpf').setCustomValidity('');
                }

                if(!form.checkValidity()){
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            })
        })
    });



</script>

<div class="text-center mt-4 mb-4 small text-muted">&copy; 2026 SYNGE. Gestão Escolar Inteligente.</div>
</body>


</html>

<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="button(label, icon, variant, size, disabled, loading, type, href)">
  <a th:if="${href != null}" th:href="${href}" th:class="${'k-button k-button--' + (variant == null ? 'primary' : variant) + ' k-button--' + (size == null ? 'md' : size)}" th:attr="aria-disabled=${disabled == true},tabindex=${disabled == true ? '-1' : null}"><span th:if="${loading == true}" class="k-button__spinner" aria-hidden="true"></span><i th:if="${loading != true and icon != null}" th:class="${'bi ' + icon}" aria-hidden="true"></i><span th:text="${loading == true ? 'Carregando...' : label}">Ação</span></a>
  <button th:unless="${href != null}" th:type="${type == null ? 'button' : type}" th:class="${'k-button k-button--' + (variant == null ? 'primary' : variant) + ' k-button--' + (size == null ? 'md' : size)}" th:disabled="${disabled == true or loading == true}" th:attr="aria-busy=${loading == true}"><span th:if="${loading == true}" class="k-button__spinner" aria-hidden="true"></span><i th:if="${loading != true and icon != null}" th:class="${'bi ' + icon}" aria-hidden="true"></i><span th:text="${loading == true ? 'Carregando...' : label}">Ação</span></button>
</th:block></body></html>

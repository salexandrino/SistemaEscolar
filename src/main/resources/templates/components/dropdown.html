<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="select(label, name, id, options, selected, required, disabled, helpText)" class="k-field"><label class="k-field__label" th:for="${id}" th:text="${label}">Selecione</label><select class="k-select" th:name="${name}" th:id="${id}" th:required="${required}" th:disabled="${disabled}"><option th:each="option : ${options}" th:value="${option}" th:text="${option}" th:selected="${option == selected}">Opção</option></select><small class="k-field__help" th:if="${helpText != null}" th:text="${helpText}">Ajuda</small></div>
<div th:fragment="actions(label, icon)" class="k-dropdown dropdown" data-k-dropdown><button class="k-button k-button--ghost k-button--sm k-dropdown__trigger" type="button" data-bs-toggle="dropdown" aria-expanded="false"><i th:if="${icon != null}" th:class="'bi ' + ${icon}" aria-hidden="true"></i><span th:text="${label}">Ações</span></button><div class="dropdown-menu k-dropdown__menu"><th:block th:insert="~{::items}"></th:block></div></div>
</body></html>

<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="input(label, name, id, type, value, placeholder, required, disabled, readonly, error, helpText, iconLeft, iconRight)" class="k-field">
  <label class="k-field__label" th:for="${id}" th:if="${label != null}"><span th:text="${label}">Campo</span><span class="k-field__required" th:if="${required == true}" aria-hidden="true"> *</span></label>
  <div class="k-input-wrapper"><i th:if="${iconLeft != null}" class="bi k-input-wrapper__icon k-input-wrapper__icon--left" th:classappend="${iconLeft}" aria-hidden="true"></i><input class="k-input" th:classappend="${error != null and !#strings.isEmpty(error) ? ' k-input--error' : ''}" th:id="${id}" th:name="${name}" th:type="${type == null ? 'text' : type}" th:value="${value}" th:placeholder="${placeholder}" th:required="${required == true}" th:disabled="${disabled == true}" th:readonly="${readonly == true}" th:attr="aria-invalid=${error != null and !#strings.isEmpty(error)},aria-describedby=${error != null and !#strings.isEmpty(error) ? id + '-error' : (helpText != null ? id + '-help' : null)}"><i th:if="${iconRight != null}" class="bi k-input-wrapper__icon k-input-wrapper__icon--right" th:classappend="${iconRight}" aria-hidden="true"></i></div>
  <small class="k-field__error" th:if="${error != null and !#strings.isEmpty(error)}" th:id="${id + '-error'}" th:text="${error}">Erro</small><small class="k-field__help" th:if="${(error == null or #strings.isEmpty(error)) and helpText != null}" th:id="${id + '-help'}" th:text="${helpText}">Ajuda</small>
</div></body></html>

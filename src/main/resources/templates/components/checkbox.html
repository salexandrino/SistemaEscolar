<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><body><label th:fragment="checkbox(name, id, label, checked, disabled, value)" class="k-checkbox" th:for="${id}"><input class="k-checkbox__input" type="checkbox" th:name="${name}" th:id="${id}" th:value="${value == null ? 'true' : value}" th:checked="${checked == true}" th:disabled="${disabled == true}"><span class="k-checkbox__control" aria-hidden="true"></span><span class="k-checkbox__label" th:text="${label}">Opção</span></label></body></html>

<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><body><article th:fragment="card(title, subtitle, icon, variant, content)" th:class="${'k-card k-card--' + (variant == null ? 'default' : variant)}"><header class="k-card__header" th:if="${title != null or subtitle != null}"><div class="k-card__heading"><i th:if="${icon != null}" th:class="${'bi k-card__icon ' + icon}" aria-hidden="true"></i><h2 class="k-card__title" th:text="${title}">Título</h2><p class="k-card__subtitle" th:if="${subtitle != null}" th:text="${subtitle}">Subtítulo</p></div></header><div class="k-card__body"><th:block th:replace="${content}"></th:block></div></article></body></html>

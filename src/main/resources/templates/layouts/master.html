<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title} ?: 'SYNGE - Gestão Escolar'">SYNGE - Gestão Escolar</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Google Fonts (Exemplo: Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Dynamic Head Content -->
    <th:block th:replace="${headContent} ?: ~{}"></th:block>
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebarFragment}"></div>

        <!-- Page Content Wrapper -->
        <div id="page-content-wrapper" class="flex-grow-1">
            <!-- Navbar -->
            <nav th:replace="~{fragments/navbar :: navbarFragment}"></nav>

            <!-- Main Content -->
            <div class="container-fluid mt-4">
                <main th:replace="${content}"></main>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <!-- Custom JS -->
    <script th:src="@{/js/validacoes.js}"></script>

    <!-- Dynamic Body Scripts -->
    <th:block th:replace="${bodyScripts} ?: ~{}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="html(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNGE - Portal Escolar</title>
    <!-- Bootstrap 5 e Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .sidebar { min-height: 100vh; width: 260px; background-color: #1e293b; color: #fff; position: fixed; }
        .sidebar .nav-link { color: #cbd5e1; transition: 0.2s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: #334155; border-radius: 6px; }
        .main-content { margin-left: 260px; padding: 30px; }
    </style>
</head>
<body>

<!-- Sidebar do Portal Escolar -->
<div class="sidebar d-flex flex-column p-3">
    <div class="d-flex align-items-center mb-4 px-2">
        <i class="bi bi-mortarboard-fill text-success fs-3 me-2"></i>
        <span class="fs-4 fw-bold">SYNGE <span class="text-success small fs-6">Escola</span></span>
    </div>
    <hr class="border-secondary">
    <ul class="nav nav-pills flex-column mb-auto gap-1">
        <li class="nav-item">
            <a href="/dashboard/escola" class="nav-link active">
                <i class="bi bi-grid-1x2-fill me-2"></i> Painel Inicial
            </a>
        </li>
        <li>
            <a href="/dashboard/escola/turmas" class="nav-link">
                <i class="bi bi-collection-fill me-2"></i> Minhas Turmas
            </a>
        </li>
        <li>
            <a href="/dashboard/escola/alunos" class="nav-link">
                <i class="bi bi-people-fill me-2"></i> Alunos
            </a>
        </li>
        <li>
            <a href="/dashboard/escola/notas" class="nav-link">
                <i class="bi bi-journal-bookmark-fill me-2"></i> Notas & Faltas
            </a>
        </li>
    </ul>
    <hr class="border-secondary">
    <div class="dropdown">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle fs-5 me-2"></i>
            <strong th:text="${usuarioLogado != null ? usuarioLogado.nomeCompleto : 'Usuário'}">Nome</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
            <li><a class="dropdown-menu-item p-2 text-white text-decoration-none d-block" href="/logout"><i class="bi bi-box-arrow-right me-2"></i> Sair</a></li>
        </ul>
    </div>
</div>

<!-- Conteúdo Dinâmico Corrigido -->
<div class="main-content">
    <div th:replace="${content}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kutuar Educação - Gestão Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background-color: var(--color-bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar-wrapper {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            overflow-y: auto;
            z-index: 999;
        }
        main {
            margin-left: 280px;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-admin {
            margin-left: 280px;
            background-color: white;
            border-bottom: 1px solid #e0e0e0;
        }
        footer {
            margin-left: 280px;
            margin-top: auto;
        }
        @media (max-width: 768px) {
            .sidebar-wrapper {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                box-shadow: 2px 0 10px rgba(0,0,0,.1);
            }
            main, .navbar-admin, footer {
                margin-left: 0;
            }
            .sidebar-wrapper.is-open { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div class="sidebar-wrapper" style="background-color: #064e26;">
    <div th:replace="~{fragments/sidebar :: sidebarFragment}"></div>
</div>

<nav class="navbar navbar-expand-lg navbar-admin px-4 py-3">
    <div class="container-fluid">
        <button class="btn btn-outline-success d-lg-none me-2" id="sidebarToggle" type="button" aria-label="Abrir menu"><i class="bi bi-list"></i></button>
        <span class="navbar-brand fw-bold text-dark">Painel Administrativo</span>
        <div class="ms-auto d-flex align-items-center">
            <span class="me-3 text-muted" th:if="${currentUser}" th:text="${currentUser.cpf}">CPF do Usuário</span>
            <a href="/auth/logout" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-right"></i> Sair
            </a>
        </div>
    </div>
</nav>

<main>
    <div class="container-fluid">
        <div th:replace="~{__${content}__ :: content}"></div>
    </div>
</main>

<footer class="bg-white text-center py-3 border-top small text-muted">
    &copy; 2026 Kutuar Educação. Gestão Escolar Inteligente.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/confirm-modal.js"></script>
<script>document.getElementById('sidebarToggle')?.addEventListener('click',()=>document.querySelector('.sidebar-wrapper')?.classList.toggle('is-open'));</script>
<div th:replace="~{fragments/modals :: deleteConfirmationModal}"></div>
</body>
</html>

<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Componentes Kutuar</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head><body><main class="k-page"><div class="k-page__inner"><h1>Design System Kutuar</h1><p class="text-muted">Documentação visual interna; este template não possui rota pública.</p>
<div class="k-grid"><section class="k-card k-card--bordered k-col-12"><header class="k-card__header"><h2 class="k-card__title">Botões</h2></header><div class="k-card__body d-flex flex-wrap gap-2"><div th:replace="~{components/button :: button('Primário', 'bi-check-lg', 'primary', 'md', false, false, 'button', null)}"></div><div th:replace="~{components/button :: button('Secundário', null, 'secondary', 'md', false, false, 'button', null)}"></div><div th:replace="~{components/button :: button('Outline', null, 'outline', 'md', false, false, 'button', null)}"></div><div th:replace="~{components/button :: button('Perigo', null, 'danger', 'md', false, false, 'button', null)}"></div><div th:replace="~{components/button :: button('Ghost', null, 'ghost', 'md', false, false, 'button', null)}"></div><div th:replace="~{components/button :: button('Desabilitado', null, 'primary', 'md', true, false, 'button', null)}"></div><div th:replace="~{components/button :: button('Carregando', null, 'primary', 'md', false, true, 'button', null)}"></div></div></section>
<section class="k-card k-card--bordered k-col-6"><header class="k-card__header"><h2 class="k-card__title">Inputs e select</h2></header><div class="k-card__body d-grid gap-3"><div th:replace="~{components/input :: input('Nome', 'nome', 'demoNome', 'text', null, 'Digite o nome', true, false, false, null, 'Texto de ajuda', 'bi-person', null)}"></div><div th:replace="~{components/input :: input('E-mail', 'email', 'demoEmail', 'email', null, null, false, false, false, 'Informe um e-mail válido', null, null, 'bi-envelope')}"></div><div th:replace="~{components/input :: input('Desabilitado', 'disabled', 'demoDisabled', 'text', 'Sem edição', null, false, true, false, null, null, null, null)}"></div><div class="k-field"><label class="k-field__label" for="demoStatus">Status</label><select class="k-select" id="demoStatus"><option>Ativo</option><option>Inativo</option></select></div></div></section>
<section class="k-card k-card--bordered k-col-6"><header class="k-card__header"><h2 class="k-card__title">Checkbox e dropdown</h2></header><div class="k-card__body d-grid gap-3"><div th:replace="~{components/checkbox :: checkbox('normal', 'demoNormal', 'Normal', false, false, '1')}"></div><div th:replace="~{components/checkbox :: checkbox('checked', 'demoChecked', 'Marcado', true, false, '1')}"></div><div th:replace="~{components/checkbox :: checkbox('disabled', 'demoCheckDisabled', 'Desabilitado', false, true, '1')}"></div><div class="k-dropdown dropdown"><button class="k-button k-button--outline k-button--md" data-bs-toggle="dropdown" type="button">Ações</button><div class="dropdown-menu k-dropdown__menu"><a class="k-dropdown__item" href="#">Visualizar</a><a class="k-dropdown__item" href="#">Editar</a><div class="k-dropdown__divider"></div><a class="k-dropdown__item text-danger" href="#">Excluir</a></div></div></div></section>
<section class="k-card k-card--default k-col-3"><div class="k-card__body">Card default</div></section><section class="k-card k-stat-card k-col-3"><i class="bi bi-buildings k-card__icon"></i><div><span class="k-stat-card__label">StatCard</span><strong class="k-stat-card__value">128</strong></div></section><section class="k-card k-content-card k-col-3"><div class="k-card__body">ContentCard</div></section><section class="k-card k-action-card k-col-3"><div class="k-card__body">ActionCard</div></section><section class="k-card k-table-card k-col-6"><div class="k-card__body"><table class="k-dashboard-table"><tr><th>TableCard</th><th>Status</th></tr><tr><td>Exemplo</td><td>Ativo</td></tr></table></div></section><section class="k-card k-chart-card k-col-6"><div class="k-card__body">ChartCard</div></section>
<section class="k-col-12"><div class="k-carousel" data-k-carousel aria-label="Comunicados"><div class="k-carousel__viewport"><div class="k-carousel__track"><article class="k-carousel__slide">Primeiro comunicado</article><article class="k-carousel__slide">Segundo comunicado</article></div></div><div class="k-carousel__controls"><button class="k-button k-button--ghost k-button--sm" data-k-carousel-prev type="button">Anterior</button><button class="k-button k-button--ghost k-button--sm" data-k-carousel-next type="button">Próximo</button></div></div></section></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/components/carousel.js"></script></body></html>

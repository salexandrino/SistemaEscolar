<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/master-escola :: html(~{::content})}">
<head>
    <title>Consultar Alunos - SYNGE</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark mb-0">Alunos</h2>
        <button class="btn btn-primary" onclick="abrirModalNovoAluno()">
            <i class="bi bi-person-plus-fill me-1"></i> Nova Matrícula
        </button>
    </div>

    <div id="mensagem-alerta-alunos" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Nome do Aluno</th>
                        <th>CPF</th>
                        <th>Situação</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                    </thead>
                    <tbody id="tabela-alunos">
                    <tr><td colspan="4" class="text-center py-4">Carregando dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal de Criar/Editar Aluno -->
    <div class="modal fade" id="modal-aluno" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-aluno-titulo">Nova Matrícula de Aluno</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="mensagem-alerta-modal-aluno" class="alert d-none" role="alert"></div>

                    <form id="form-aluno">
                        <input type="hidden" id="alunoId">

                        <h6 class="fw-bold">Identificação Pessoal</h6>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Nome Completo *</label>
                                <input type="text" class="form-control" id="nome" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">CPF</label>
                                <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Data de Nascimento</label>
                                <input type="date" class="form-control" id="dataNascimento">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Código INEP do Aluno</label>
                                <input type="text" class="form-control" id="codigoInep">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Nome do Pai / Responsável 1</label>
                                <input type="text" class="form-control" id="nomePai">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Nome da Mãe / Responsável 2</label>
                                <input type="text" class="form-control" id="nomeMae">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Sexo</label>
                                <select class="form-select" id="sexo">
                                    <option value="">-</option>
                                    <option value="MASCULINO">Masculino</option>
                                    <option value="FEMININO">Feminino</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Cor/Raça</label>
                                <select class="form-select" id="corRaca">
                                    <option value="">-</option>
                                    <option value="BRANCA">Branca</option>
                                    <option value="PRETA">Preta</option>
                                    <option value="PARDA">Parda</option>
                                    <option value="AMARELA">Amarela</option>
                                    <option value="INDIGENA">Indígena</option>
                                    <option value="NAO_DECLARADA">Não declarada</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-3">
                                <label class="form-label">Nacionalidade</label>
                                <input type="text" class="form-control" id="nacionalidade" value="Brasileira">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">UF de Nascimento</label>
                                <input type="text" maxlength="2" class="form-control text-uppercase" id="ufNascimento">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Município de Nascimento</label>
                                <input type="text" class="form-control" id="municipioNascimento">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Nº Certidão de Nascimento</label>
                                <input type="text" class="form-control" id="certidaoNascimento">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">NIS</label>
                                <input type="text" class="form-control" id="nis">
                            </div>
                        </div>

                        <h6 class="fw-bold">Contato</h6>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Telefone</label>
                                <input type="text" class="form-control" id="telefone">
                            </div>
                        </div>

                        <h6 class="fw-bold">Endereço</h6>
                        <div class="row g-3 mb-3">
                            <div class="col-md-2">
                                <label class="form-label">CEP</label>
                                <input type="text" class="form-control" id="cep">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Endereço/Logradouro</label>
                                <input type="text" class="form-control" id="endereco">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Número</label>
                                <input type="text" class="form-control" id="numero">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Complemento</label>
                                <input type="text" class="form-control" id="complemento">
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-3">
                                <label class="form-label">Bairro</label>
                                <input type="text" class="form-control" id="bairro">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Cidade</label>
                                <input type="text" class="form-control" id="cidade">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">UF</label>
                                <input type="text" maxlength="2" class="form-control text-uppercase" id="estado">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Zona</label>
                                <select class="form-select" id="zona">
                                    <option value="">-</option>
                                    <option value="URBANA">Urbana</option>
                                    <option value="RURAL">Rural</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Localização Diferenciada</label>
                                <select class="form-select" id="localizacaoDiferenciada">
                                    <option value="NAO_DIFERENCIADA">Não diferenciada</option>
                                    <option value="ASSENTAMENTO">Assentamento</option>
                                    <option value="TERRA_INDIGENA">Terra indígena</option>
                                    <option value="QUILOMBOLA">Quilombola</option>
                                </select>
                            </div>
                        </div>

                        <h6 class="fw-bold">Transporte Escolar</h6>
                        <div class="row g-3 mb-3">
                            <div class="col-md-3 d-flex align-items-end">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="usaTransporteEscolar">
                                    <label class="form-check-label" for="usaTransporteEscolar">Usa transporte escolar</label>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Responsável pelo Transporte</label>
                                <select class="form-select" id="responsavelTransporte">
                                    <option value="NENHUM">Nenhum</option>
                                    <option value="ESTADUAL">Estadual</option>
                                    <option value="MUNICIPAL">Municipal</option>
                                </select>
                            </div>
                        </div>

                        <h6 class="fw-bold">Acessibilidade / Educação Especial</h6>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Tipo de Condição (se houver)</label>
                                <input type="text" class="form-control" id="tipoCondicao" placeholder="Ex.: Nenhuma, TEA, Deficiência física...">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Recursos de Acessibilidade Necessários</label>
                                <textarea class="form-control" id="recursosAcessibilidade" rows="1" placeholder="Ex.: Prova ampliada, intérprete de Libras..."></textarea>
                            </div>
                        </div>

                        <div id="bloco-vinculo-turma">
                            <h6 class="fw-bold">Vínculo com a Turma</h6>
                            <div class="row g-3 mb-2">
                                <div class="col-md-4">
                                    <label class="form-label">Ano Letivo</label>
                                    <select class="form-select" id="selectAnoLetivo" onchange="carregarSeries()">
                                        <option value="">Selecione...</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Série</label>
                                    <select class="form-select" id="selectSerie" onchange="carregarTurmas()" disabled>
                                        <option value="">Selecione o ano letivo primeiro...</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Turma</label>
                                    <select class="form-select" id="selectTurma" disabled>
                                        <option value="">Selecione a série primeiro...</option>
                                    </select>
                                </div>
                            </div>
                            <small class="text-muted">Ao criar o aluno, se uma turma for selecionada, ele já é matriculado automaticamente.</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-salvar-aluno" onclick="salvarAluno()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let modoEdicao = false;
        let modalAluno;

        document.addEventListener('DOMContentLoaded', function () {
            carregarAlunos();
            modalAluno = new bootstrap.Modal(document.getElementById('modal-aluno'));
            document.getElementById('usaTransporteEscolar').addEventListener('change', function () {
                document.getElementById('responsavelTransporte').value = this.checked ? 'ESTADUAL' : 'NENHUM';
            });
        });

        function mostrarAlertaAlunos(msg, tipo) {
            const el = document.getElementById('mensagem-alerta-alunos');
            el.className = `alert alert-${tipo} mb-4`;
            el.innerText = msg;
        }

        function mostrarAlertaModal(msg, tipo) {
            const el = document.getElementById('mensagem-alerta-modal-aluno');
            el.className = `alert alert-${tipo}`;
            el.innerText = msg;
        }

        function carregarAlunos() {
            fetch('/api/academico/alunos')
                .then(response => {
                    if (!response.ok) throw new Error('Erro ao carregar alunos');
                    return response.json();
                })
                .then(dados => renderizarTabela(dados))
                .catch(erro => {
                    console.error(erro);
                    document.getElementById('tabela-alunos').innerHTML =
                        `<tr><td colspan="4" class="text-center text-danger py-4">Erro ao carregar dados. ${erro.message}</td></tr>`;
                });
        }
        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabela-alunos');
            tbody.innerHTML = '';

            if (!dados || dados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">Nenhum aluno encontrado.</td></tr>';
                return;
            }

            dados.forEach(aluno => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="ps-4 fw-medium" style="cursor:pointer" onclick="abrirModalEditarAluno('${aluno.id}')">${aluno.nome}</td>
                    <td>${aluno.cpf || '-'}</td>
                    <td><span class="badge bg-secondary">${aluno.situacao || 'DESCONHECIDO'}</span></td>
                    <td class="text-end pe-4">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="abrirModalEditarAluno('${aluno.id}')" title="Editar"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-info me-1" onclick="verHistorico('${aluno.id}')" title="Histórico Escolar"><i class="bi bi-file-earmark-text"></i></button>
                        <button class="btn btn-sm btn-outline-warning" onclick="alterarSituacao('${aluno.id}')" title="Alterar Situação"><i class="bi bi-arrow-repeat"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function limparFormulario() {
            document.getElementById('form-aluno').reset();
            document.getElementById('alunoId').value = '';
            document.getElementById('localizacaoDiferenciada').value = 'NAO_DIFERENCIADA';
            document.getElementById('responsavelTransporte').value = 'NENHUM';
            document.getElementById('nacionalidade').value = 'Brasileira';
            document.getElementById('mensagem-alerta-modal-aluno').className = 'alert d-none';
        }

        function abrirModalNovoAluno() {
            modoEdicao = false;
            limparFormulario();
            document.getElementById('modal-aluno-titulo').innerText = 'Nova Matrícula de Aluno';
            document.getElementById('bloco-vinculo-turma').style.display = 'block';
            carregarAnosLetivos();
            modalAluno.show();
        }

        function abrirModalEditarAluno(id) {
            modoEdicao = true;
            limparFormulario();
            document.getElementById('modal-aluno-titulo').innerText = 'Editar Aluno';
            // Edição não mexe na matrícula/turma por aqui — isso é feito por
            // transferência (botão próprio), então escondemos esse bloco.
            document.getElementById('bloco-vinculo-turma').style.display = 'none';

            fetch(`/api/academico/alunos/${id}`)
                .then(r => r.json())
                .then(a => {
                    document.getElementById('alunoId').value = a.id;
                    document.getElementById('nome').value = a.nome || '';
                    document.getElementById('cpf').value = a.cpf || '';
                    document.getElementById('dataNascimento').value = a.dataNascimento || '';
                    document.getElementById('codigoInep').value = a.codigoInep || '';
                    document.getElementById('nomePai').value = a.nomePai || '';
                    document.getElementById('nomeMae').value = a.nomeMae || '';
                    document.getElementById('sexo').value = a.sexo || '';
                    document.getElementById('corRaca').value = a.corRaca || '';
                    document.getElementById('nacionalidade').value = a.nacionalidade || 'Brasileira';
                    document.getElementById('ufNascimento').value = a.ufNascimento || '';
                    document.getElementById('municipioNascimento').value = a.municipioNascimento || '';
                    document.getElementById('certidaoNascimento').value = a.certidaoNascimento || '';
                    document.getElementById('nis').value = a.nis || '';
                    document.getElementById('email').value = a.email || '';
                    document.getElementById('telefone').value = a.telefone || '';
                    document.getElementById('cep').value = a.cep || '';
                    document.getElementById('endereco').value = a.endereco || '';
                    document.getElementById('numero').value = a.numero || '';
                    document.getElementById('complemento').value = a.complemento || '';
                    document.getElementById('bairro').value = a.bairro || '';
                    document.getElementById('cidade').value = a.cidade || '';
                    document.getElementById('estado').value = a.estado || '';
                    document.getElementById('zona').value = a.zona || '';
                    document.getElementById('localizacaoDiferenciada').value = a.localizacaoDiferenciada || 'NAO_DIFERENCIADA';
                    document.getElementById('usaTransporteEscolar').checked = !!a.usaTransporteEscolar;
                    document.getElementById('responsavelTransporte').value = a.responsavelTransporte || 'NENHUM';
                    document.getElementById('tipoCondicao').value = a.tipoCondicao || '';
                    document.getElementById('recursosAcessibilidade').value = a.recursosAcessibilidade || '';
                    modalAluno.show();
                })
                .catch(erro => {
                    console.error(erro);
                    mostrarAlertaAlunos('Erro ao carregar dados do aluno.', 'danger');
                });
        }

        function montarPayload() {
            return {
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value || null,
                dataNascimento: document.getElementById('dataNascimento').value || null,
                email: document.getElementById('email').value || null,
                telefone: document.getElementById('telefone').value || null,
                codigoInep: document.getElementById('codigoInep').value || null,
                nomePai: document.getElementById('nomePai').value || null,
                nomeMae: document.getElementById('nomeMae').value || null,
                sexo: document.getElementById('sexo').value || null,
                corRaca: document.getElementById('corRaca').value || null,
                nacionalidade: document.getElementById('nacionalidade').value || null,
                ufNascimento: document.getElementById('ufNascimento').value || null,
                municipioNascimento: document.getElementById('municipioNascimento').value || null,
                certidaoNascimento: document.getElementById('certidaoNascimento').value || null,
                nis: document.getElementById('nis').value || null,
                cep: document.getElementById('cep').value || null,
                endereco: document.getElementById('endereco').value || null,
                numero: document.getElementById('numero').value || null,
                complemento: document.getElementById('complemento').value || null,
                bairro: document.getElementById('bairro').value || null,
                cidade: document.getElementById('cidade').value || null,
                estado: document.getElementById('estado').value || null,
                zona: document.getElementById('zona').value || null,
                localizacaoDiferenciada: document.getElementById('localizacaoDiferenciada').value,
                usaTransporteEscolar: document.getElementById('usaTransporteEscolar').checked,
                responsavelTransporte: document.getElementById('responsavelTransporte').value,
                tipoCondicao: document.getElementById('tipoCondicao').value || null,
                recursosAcessibilidade: document.getElementById('recursosAcessibilidade').value || null
            };
        }

        function salvarAluno() {
            const nome = document.getElementById('nome').value;
            if (!nome || !nome.trim()) {
                mostrarAlertaModal('Nome é obrigatório.', 'danger');
                return;
            }

            const payload = montarPayload();
            const id = document.getElementById('alunoId').value;
            const url = modoEdicao ? `/api/academico/alunos/${id}` : '/api/academico/alunos';
            const metodo = modoEdicao ? 'PUT' : 'POST';

            const btn = document.getElementById('btn-salvar-aluno');
            btn.disabled = true;
            btn.innerText = 'Salvando...';

            fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(response => response.json().then(body => ({ status: response.status, body })))
                .then(async resultado => {
                    btn.disabled = false;
                    btn.innerText = 'Salvar';

                    if (resultado.status !== 200 && resultado.status !== 201) {
                        mostrarAlertaModal(resultado.body.message || 'Erro ao salvar aluno.', 'danger');
                        return;
                    }

                    const idTurma = document.getElementById('selectTurma').value;
                    if (!modoEdicao && idTurma) {
                        const idAlunoCriado = resultado.body.id;
                        try {
                            const respMatricula = await fetch(`/api/academico/alunos/${idAlunoCriado}/matriculas`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ idTurma: idTurma })
                            });
                            if (!respMatricula.ok) {
                                const erroMatricula = await respMatricula.json();
                                mostrarAlertaAlunos('Aluno criado, mas não foi possível matricular na turma: ' + (erroMatricula.message || 'erro desconhecido'), 'warning');
                                modalAluno.hide();
                                carregarAlunos();
                                return;
                            }
                        } catch (e) {
                            console.error(e);
                        }
                    }

                    modalAluno.hide();
                    mostrarAlertaAlunos(modoEdicao ? 'Aluno atualizado com sucesso.' : 'Aluno cadastrado com sucesso.', 'success');
                    carregarAlunos();
                })
                .catch(erro => {
                    console.error(erro);
                    btn.disabled = false;
                    btn.innerText = 'Salvar';
                    mostrarAlertaModal('Erro interno ao salvar aluno.', 'danger');
                });
        }

        function carregarAnosLetivos() {
            fetch('/api/academico/anos-letivos')
                .then(r => r.json())
                .then(lista => {
                    const select = document.getElementById('selectAnoLetivo');
                    select.innerHTML = '<option value="">Selecione...</option>';
                    lista.forEach(al => {
                        const opt = document.createElement('option');
                        opt.value = al.id;
                        opt.innerText = al.ano || al.descricao || al.id;
                        select.appendChild(opt);
                    });
                })
                .catch(erro => console.error('Erro ao carregar anos letivos:', erro));
        }

        function carregarSeries() {
            const idAnoLetivo = document.getElementById('selectAnoLetivo').value;
            const selectSerie = document.getElementById('selectSerie');
            const selectTurma = document.getElementById('selectTurma');
            selectSerie.innerHTML = '<option value="">Selecione...</option>';
            selectTurma.innerHTML = '<option value="">Selecione a série primeiro...</option>';
            selectTurma.disabled = true;

            if (!idAnoLetivo) {
                selectSerie.disabled = true;
                return;
            }

            fetch(`/api/academico/series?idAnoLetivo=${idAnoLetivo}`)
                .then(r => r.json())
                .then(lista => {
                    lista.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.id;
                        opt.innerText = s.nome || s.descricao || s.id;
                        selectSerie.appendChild(opt);
                    });
                    selectSerie.disabled = false;
                })
                .catch(erro => console.error('Erro ao carregar séries:', erro));
        }

        function carregarTurmas() {
            const idAnoLetivo = document.getElementById('selectAnoLetivo').value;
            const idSerie = document.getElementById('selectSerie').value;
            const selectTurma = document.getElementById('selectTurma');
            selectTurma.innerHTML = '<option value="">Selecione...</option>';

            if (!idSerie) {
                selectTurma.disabled = true;
                return;
            }

            fetch(`/api/academico/turmas?idAnoLetivo=${idAnoLetivo}&idSerie=${idSerie}`)
                .then(r => r.json())
                .then(lista => {
                    lista.forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t.id;
                        opt.innerText = `${t.nome} (${t.turno || ''})`;
                        selectTurma.appendChild(opt);
                    });
                    selectTurma.disabled = false;
                })
                .catch(erro => console.error('Erro ao carregar turmas:', erro));
        }

        function verHistorico(id) {
            fetch(`/api/academico/alunos/${id}/historico-escolar`)
                .then(res => res.ok ? res.json() : null)
                .then(data => console.log('Histórico:', data))
                .catch(err => console.error(err));
        }

        function alterarSituacao(id) {
            const novaSituacao = prompt("Digite a nova situação (ex: ATIVO, INATIVO, TRANCADO):");
            if (!novaSituacao) return;
            fetch(`/api/academico/alunos/${id}/situacao`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ novaSituacao: novaSituacao.toUpperCase(), motivo: 'Alteração manual via tela' })
            }).then(response => {
                if (response.ok) carregarAlunos();
                else response.json().then(body => mostrarAlertaAlunos(body.message || 'Erro ao alterar situação.', 'danger'));
            });
        }
    </script>
</div>
</body>
</html>

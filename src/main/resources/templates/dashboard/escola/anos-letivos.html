<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/master-escola :: html(~{::content})}">
<head>
    <title>Anos Letivos - SYNGE</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark mb-0">Anos Letivos</h2>
        <button class="btn btn-primary" onclick="alert('Funcionalidade de criação a ser implementada')">
            <i class="bi bi-plus-lg me-1"></i> Novo Ano Letivo
        </button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Ano</th>
                        <th>Data Início</th>
                        <th>Data Fim</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                    </thead>
                    <tbody id="tabela-anos-letivos">
                    <tr><td colspan="5" class="text-center py-4">Carregando dados...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', carregarAnosLetivos);

        function carregarAnosLetivos() {
            fetch('/api/academico/anos-letivos')
                .then(response => {
                    if (!response.ok) throw new Error('Erro ao carregar anos letivos');
                    return response.json();
                })
                .then(dados => renderizarTabela(dados))
                .catch(erro => {
                    console.error(erro);
                    document.getElementById('tabela-anos-letivos').innerHTML =
                        `<tr><td colspan="5" class="text-center text-danger py-4">Erro ao carregar dados. ${erro.message}</td></tr>`;
                });
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabela-anos-letivos');
            tbody.innerHTML = '';

            if (!dados || dados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Nenhum ano letivo encontrado.</td></tr>';
                return;
            }

            dados.forEach(ano => {
                const isAtivo = ano.ativo;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="ps-4 fw-medium">${ano.ano}</td>
                    <td>${ano.dataInicio || '-'}</td>
                    <td>${ano.dataFim || '-'}</td>
                    <td>
                        <span class="badge ${isAtivo ? 'bg-success' : 'bg-secondary'}">
                            ${isAtivo ? 'Ativo' : 'Arquivado'}
                        </span>
                    </td>
                    <td class="text-end pe-4">
                        ${!isAtivo ? \`<button class="btn btn-sm btn-outline-success me-1" onclick="ativarAno('\${ano.id}')" title="Definir como Ativo"><i class="bi bi-check-circle"></i></button>\` : ''}
                        ${isAtivo ? \`<button class="btn btn-sm btn-outline-secondary me-1" onclick="arquivarAno('\${ano.id}')" title="Arquivar"><i class="bi bi-archive"></i></button>\` : ''}
                        <button class="btn btn-sm btn-outline-primary" onclick="clonarAno('\${ano.id}')" title="Clonar Estrutura"><i class="bi bi-copy"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function ativarAno(id) {
            if(!confirm('Deseja definir este ano letivo como ATIVO? O ano ativo atual será substituído.')) return;
            fetch(`/api/academico/anos-letivos/${id}/definir-ativo`, { method: 'PATCH' })
                .then(response => {
                    if(response.ok) carregarAnosLetivos();
                    else alert('Erro ao ativar ano letivo.');
                });
        }

        function arquivarAno(id) {
            if(!confirm('Deseja arquivar este ano letivo?')) return;
            fetch(`/api/academico/anos-letivos/${id}/arquivar`, { method: 'PATCH' })
                .then(response => {
                    if(response.ok) carregarAnosLetivos();
                    else alert('Erro ao arquivar ano letivo.');
                });
        }

        function clonarAno(id) {
            const novoAno = prompt("Digite o ID do novo Ano Letivo destino (para onde os dados serão clonados):");
            if(!novoAno) return;
            fetch(`/api/academico/anos-letivos/${id}/clonar-para/${novoAno}`, { method: 'POST' })
                .then(response => {
                    if(response.ok) {
                        alert('Estrutura clonada com sucesso!');
                        carregarAnosLetivos();
                    } else {
                        alert('Erro ao clonar estrutura.');
                    }
                });
        }
    </script>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/master-admin :: html}">
<head>
    <title>Usuários - SYNGE</title>
</head>
<body>

<div th:fragment="content">
    <nav class="breadcrumb-admin mb-4">
        <a href="/dashboard" class="text-decoration-none">Dashboard</a>
        <span class="mx-2">></span>
        <span class="text-muted">Usuários</span>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="page-title mb-0">
                <i class="bi bi-people me-2"></i> Gerenciamento de Usuários
            </h2>
        </div>
        <div>
            <a href="/dashboard/usuarios/novo" class="btn btn-success">
                <i class="bi bi-person-plus me-1"></i> Novo Usuário
            </a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">Usuários Cadastrados</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Email</th>
                        <th>CPF</th>
                        <th>Perfil</th>
                        <th>Status</th>
                        <th class="text-end pe-4" width="150">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td class="ps-4 fw-semibold text-dark" th:text="${usuario.nomeCompleto}">Nome do Usuário</td>
                        <td th:text="${usuario.email}">email@exemplo.com</td>
                        <td th:text="${usuario.cpf}">000.000.000-00</td>
                        <td>
                            <span class="badge bg-secondary px-2 py-1.5" th:text="${usuario.perfil}">Perfil</span>
                        </td>
                        <td>
                            <span class="badge bg-success" th:if="${usuario.aprovado}">Ativo</span>
                            <span class="badge bg-danger" th:unless="${usuario.aprovado}">Inativo</span>
                        </td>
                        <td>
                            <a th:href="'/dashboard/usuarios/visualizar/' + ${usuario.id}" class="btn btn-primary btn-sm">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="'/dashboard/usuarios/editar/' + ${usuario.id}" class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="6" class="text-center py-4 text-muted">
                            Nenhum usuário cadastrado no sistema.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>

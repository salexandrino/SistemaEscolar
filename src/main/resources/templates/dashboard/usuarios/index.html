<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Teste</title>
</head>

<body>

<h1>Funcionou!</h1>

<p th:text="${usuarios}"></p>

</body>
</html>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Usuários
        </h2>

        <a href="/dashboard/usuarios/novo"
           class="btn btn-success">

            <i class="bi bi-person-plus"></i>
            Novo Usuário

        </a>

    </div>

    <div class="card">

        <div class="card-body">

            <table class="table table-striped align-middle">

                <thead>

                <tr>

                    <th>Nome</th>
                    <th>Email</th>
                    <th>CPF</th>
                    <th>Perfil</th>
                    <th>Aprovado</th>
                    <th>Ações</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="usuario : ${usuarios}">

                    <td th:text="${usuario.nomeCompleto}">
                        Nome
                    </td>

                    <td th:text="${usuario.email}">
                        Email
                    </td>

                    <td th:text="${usuario.cpf}">
                        CPF
                    </td>

                    <td th:text="${usuario.perfil}">
                        Perfil
                    </td>

                    <td>

                        <span
                                class="badge bg-success"
                                th:if="${usuario.aprovado}">

                            Sim

                        </span>

                        <span
                                class="badge bg-warning"
                                th:unless="${usuario.aprovado}">

                            Não

                        </span>

                    </td>

                    <td>

                        <a
                                th:href="@{/dashboard/usuarios/visualizar/{id}(id=${usuario.id})}"
                                class="btn btn-primary btn-sm">

                            Visualizar

                        </a>

                        <a
                                th:href="@{/dashboard/usuarios/editar/{id}(id=${usuario.id})}"
                                class="btn btn-warning btn-sm">

                            Editar

                        </a>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(usuarios)}">

                    <td colspan="6" class="text-center">

                        Nenhum usuário encontrado.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</html>

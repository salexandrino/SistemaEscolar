<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/master-admin :: html}">

<div th:fragment="content">

    <!-- Breadcrumb -->
    <nav class="breadcrumb-admin mb-4">
        <a href="/dashboard">Dashboard</a>
        <span class="mx-2">></span>
        <a href="/dashboard/usuarios">Usuários</a>
        <span class="mx-2">></span>
        <span class="text-muted">Visualizar Usuário</span>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title">
            <i class="bi bi-person-lines-fill me-2"></i>
            Visualizar Usuário
        </h2>

        <a href="/dashboard/usuarios" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i>
            Voltar
        </a>
    </div>

    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">
                <i class="bi bi-person-circle"></i>
                Dados do Usuário
            </h5>
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Nome Completo</label>

                    <div class="form-control bg-light"
                         th:text="${usuario.nomeCompleto}">
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Email</label>

                    <div class="form-control bg-light"
                         th:text="${usuario.email}">
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="fw-bold">CPF</label>

                    <div class="form-control bg-light"
                         th:text="${usuario.cpf}">
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="fw-bold">Telefone</label>

                    <div class="form-control bg-light"
                         th:text="${usuario.telefone}">
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="fw-bold">Perfil</label>

                    <div class="form-control bg-light"
                         th:text="${usuario.perfil}">
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Escola</label>

                    <div class="form-control bg-light"
                         th:text="${usuario.escola != null ? usuario.escola.nome : '-'}">
                    </div>
                </div>

                <div class="col-md-3 mb-3">
                    <label class="fw-bold">Status</label>

                    <div>

                        <span class="badge bg-success"
                              th:if="${usuario.status.name() == 'ATIVO'}">
                            Ativo
                        </span>

                        <span class="badge bg-danger"
                              th:if="${usuario.status.name() == 'INATIVO'}">
                            Inativo
                        </span>

                        <span class="badge bg-warning text-dark"
                              th:if="${usuario.status.name() == 'PENDENTE'}">
                            Pendente
                        </span>

                    </div>
                </div>

                <div class="col-md-3 mb-3">
                    <label class="fw-bold">Aprovado</label>

                    <div>

                        <span class="badge bg-success"
                              th:if="${usuario.aprovado}">
                            Sim
                        </span>

                        <span class="badge bg-danger"
                              th:unless="${usuario.aprovado}">
                            Não
                        </span>

                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Criado em</label>

                    <div class="form-control bg-light"
                         th:text="${#temporals.format(usuario.criadoEm,'dd/MM/yyyy HH:mm')}">
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Última atualização</label>

                    <div class="form-control bg-light"
                         th:text="${#temporals.format(usuario.atualizadoEm,'dd/MM/yyyy HH:mm')}">
                    </div>
                </div>

            </div>

            <hr>

            <div class="d-flex justify-content-end gap-2">

                <a th:href="@{/dashboard/usuarios/editar/{id}(id=${usuario.id})}"
                   class="btn btn-warning">

                    <i class="bi bi-pencil"></i>

                    Editar

                </a>

                <a href="/dashboard/usuarios"
                   class="btn btn-secondary">

                    Fechar

                </a>

            </div>

        </div>

    </div>

</div>

</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Usuário - SYNGE</title>
</head>
<body>

<div th:fragment="content">
    <nav class="breadcrumb-admin mb-4">
        <a href="/dashboard" class="text-decoration-none">Dashboard</a>
        <span class="mx-2">></span>
        <a href="/dashboard/usuarios" class="text-decoration-none">Usuários</a>
        <span class="mx-2">></span>
        <span class="text-muted">Novo Usuário</span>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="page-title mb-1">
                <i class="bi bi-person-plus me-2"></i> Novo Usuário
            </h2>
            <small class="text-muted">Insira as informações completas para cadastrar o novo usuário no sistema.</small>
        </div>
        <a href="/dashboard/usuarios" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0"><i class="bi bi-person-fill-add me-2"></i>Formulário de Cadastro</h5>
        </div>
        <div class="card-body p-4">
            <form action="/auth/register" method="post">

                <h6 class="text-success fw-bold mb-3"><i class="bi bi-person-vcard me-2"></i>Dados Pessoais e de Acesso</h6>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Nome Completo</label>
                        <input type="text" class="form-control" name="nomeCompleto" placeholder="Digite o nome completo" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" name="email" placeholder="nome@exemplo.com" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">CPF</label>
                        <input type="text" class="form-control" name="cpf" placeholder="000.000.000-00" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Telefone</label>
                        <input type="text" class="form-control" name="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Senha de Acesso</label>
                        <input type="password" class="form-control" name="senha" placeholder="Crie uma senha temporária" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Data de Nascimento</label>
                        <input type="date" class="form-control" name="dataNascimento" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Sexo</label>
                        <select class="form-select" name="sexo" required>
                            <option value="">Selecione...</option>
                            <option value="MASCULINO">Masculino</option>
                            <option value="FEMININO">Feminino</option>
                            <option value="OUTRO">Outro</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Status Inicial</label>
                        <select class="form-select" name="aprovado" required>
                            <option value="true" selected>Ativo</option>
                            <option value="false">Inativo</option>
                        </select>
                    </div>
                </div>

                <h6 class="text-success fw-bold mt-4 mb-3"><i class="bi bi-building-gear me-2"></i>Atribuição e Vínculo</h6>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Perfil Atual</label>
                        <select class="form-select" name="perfil" required>
                            <option value="">Selecione o perfil profissional...</option>
                            <option value="PROFESSOR">Professor</option>
                            <option value="GESTOR">Gestor</option>
                            <option value="SECRETARIA">Secretaria</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Escola Vínculo</label>
                        <select class="form-select" name="escolaId" required>
                            <option value="">Selecione a instituição...</option>
                            <option th:each="escola : ${escolas}" th:value="${escola.id}" th:text="${escola.nome}"></option>
                        </select>
                    </div>
                </div>

                <h6 class="text-success fw-bold mt-4 mb-3"><i class="bi bi-geo-alt me-2"></i>Endereço Residencial</h6>
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-semibold">CEP</label>
                        <input type="text" class="form-control" name="cep" placeholder="00000-000">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Endereço (Rua/Av.)</label>
                        <input type="text" class="form-control" name="endereco" placeholder="Ex: Av. Brasil">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-semibold">Complemento</label>
                        <input type="text" class="form-control" name="complemento" placeholder="Apto, Bloco, etc.">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Bairro</label>
                        <input type="text" class="form-control" name="bairro" placeholder="Nome do bairro">
                    </div>
                    <div class="col-md-5 mb-3">
                        <label class="form-label fw-semibold">Cidade</label>
                        <input type="text" class="form-control" name="cidade" placeholder="Nome da cidade">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-semibold">Estado (UF)</label>
                        <input type="text" class="form-control" name="estado" maxlength="2" placeholder="Ex: SP">
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">
                    <a href="/dashboard/usuarios" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success px-4">
                        <i class="bi bi-check-circle me-1"></i> Cadastrar Usuário
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>

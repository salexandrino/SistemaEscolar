<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/master-admin :: html}">
<head>
    <meta charset="UTF-8">
    <title>Novo Usuário - SYNGE</title>
</head>
<body>
<div th:fragment="content">

    <nav class="breadcrumb-admin">
        <a href="/dashboard" class="text-decoration-none" style="color: var(--color-primary);">Dashboard</a>
        <span class="mx-2">></span>
        <a href="/dashboard/usuarios" class="text-decoration-none" style="color: var(--color-primary);">Usuários</a>
        <span class="mx-2">></span>
        <span class="text-muted">Novo Usuário</span>
    </nav>

    <h1 class="page-title">Novo Usuário</h1>

    <div class="form-container bg-white p-4 rounded-3 shadow-sm">
        <form action="/dashboard/usuarios/salvar" method="POST">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">Nome Completo *</label>
                        <input type="text" class="form-control" name="nomeCompleto" required placeholder="Digite o nome completo">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">Email *</label>
                        <input type="email" class="form-control" name="email" required placeholder="Digite o email">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">CPF *</label>
                        <input type="text" class="form-control" name="cpf" required placeholder="000.000.000-00">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">Telefone</label>
                        <input type="text" class="form-control" name="telefone" placeholder="(00) 00000-0000">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">Perfil de Acesso *</label>
                        <select class="form-select" name="perfil" required>
                            <option value="" disabled selected>Selecione um perfil</option>
                            <option value="SUPER_ADMIN">Super Admin</option>
                            <option value="GESTOR">Gestor</option>
                            <option value="PROFESSOR">Professor</option>
                            <option value="SECRETARIA">Secretária</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">Escola *</label>
                        <select class="form-select" name="escolaId" required>
                            <option value="" disabled selected>Selecione uma escola</option>
                            <option value="1">Escola Estadual João</option>
                            <option value="2">Escola Municipal Das Flores</option>
                            <option value="3">Escola Privada Saber</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">Senha *</label>
                        <input type="password" class="form-control" name="senha" required placeholder="Digite uma senha">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">Confirmar Senha *</label>
                        <input type="password" class="form-control" name="confirmacaoSenha" required placeholder="Confirme a senha">
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                <a href="/dashboard/usuarios" class="btn btn-outline-secondary px-4">Cancelar</a>
                <button type="submit" class="btn text-white px-4" style="background-color: var(--color-accent);">
                    <i class="bi bi-save me-1"></i> Salvar Usuário
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/master-admin :: html}">

<div th:fragment="content">

    <!-- Breadcrumb -->
    <nav class="breadcrumb-admin mb-4">
        <a href="/dashboard">Dashboard</a>
        <span class="mx-2">></span>
        <a href="/dashboard/usuarios">Usuários</a>
        <span class="mx-2">></span>
        <span class="text-muted">Novo Usuário</span>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="page-title">
            <i class="bi bi-person-plus me-2"></i>
            Novo Usuário
        </h2>

        <a href="/dashboard/usuarios"
           class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Voltar

        </a>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-header bg-success text-white">

            <h5 class="mb-0">

                <i class="bi bi-person-fill-add"></i>

                Cadastro de Usuário

            </h5>

        </div>

        <div class="card-body">

            <form
                    th:action="@{/auth/register}"
                    method="post">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Nome Completo
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                name="nomeCompleto"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                                type="email"
                                class="form-control"
                                name="email"
                                required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            CPF
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                name="cpf"
                                required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Telefone
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                name="telefone"
                                required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Senha
                        </label>

                        <input
                                type="password"
                                class="form-control"
                                name="senha"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Perfil
                        </label>

                        <select
                                class="form-select"
                                name="perfil"
                                required>

                            <option value="">Selecione...</option>
                            <option value="GESTOR">Gestor</option>
                            <option value="SECRETARIA">Secretaria</option>
                            <option value="PROFESSOR">Professor</option>
                            <option value="SUPER_ADMIN">Super Admin</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Escola
                        </label>

                        <select
                                class="form-select"
                                name="escolaId">

                            <option value="">Selecione uma escola...</option>

                            <option
                                    th:each="escola : ${escolas}"
                                    th:value="${escola.id}"
                                    th:text="${escola.nome}">
                            </option>

                        </select>

                    </div>

                </div>

                <hr>

                <div class="d-flex justify-content-end gap-2">

                    <a
                            href="/dashboard/usuarios"
                            class="btn btn-outline-secondary">

                        Cancelar

                    </a>

                    <button
                            type="submit"
                            class="btn btn-success">

                        <i class="bi bi-check-circle"></i>

                        Cadastrar Usuário

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</html>

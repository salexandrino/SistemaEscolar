<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Usuário - Kutuar Educação</title>
</head>
<body>

<div th:fragment="content" class="gestao-escolas-page" data-page="usuario-form">
    <nav class="breadcrumb-admin mb-4" aria-label="Breadcrumb">
        <a href="/dashboard" class="text-decoration-none">Dashboard</a>
        <span class="mx-2">></span>
        <a href="/dashboard/usuarios" class="text-decoration-none">Usuários</a>
        <span class="mx-2">></span>
        <span class="text-muted">Editar Usuário</span>
    </nav>

    <header class="gestao-escolas-header">
        <div>
            <h2 class="page-title mb-0">
                <i class="bi bi-pencil-square me-2"></i>
                Editar Usuário
            </h2>
            <p class="text-muted small mb-0">Atualize as informações cadastrais do usuário.</p>
        </div>
        <div th:replace="~{components/button :: button('Voltar', 'bi-arrow-left', 'outline', 'md', false, false, 'button', '/dashboard/usuarios')}"></div>
    </header>

    <form th:action="'/users/' + ${usuario.id}" method="post" data-method="PUT" th:attr="data-profile-endpoint=${'/users/' + usuario.id + '/profile'}" data-usuario-form data-success-param="atualizado">
        <section class="dashboard-panel mb-4" aria-labelledby="dadosPessoaisTitulo">
            <div class="panel-heading">
                <div>
                    <span class="panel-icon"><i class="bi bi-person-vcard" aria-hidden="true"></i></span>
                    <h2 id="dadosPessoaisTitulo">Dados pessoais</h2>
                    <p>Identificação e contato do usuário.</p>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-6" th:insert="~{components/input :: input('Nome Completo', 'nomeCompleto', 'nomeCompleto', 'text', ${usuario.nomeCompleto}, null, true, false, false, null, null, 'bi-person', null)}"></div>
                <div class="col-md-6" th:insert="~{components/input :: input('E-mail', 'email', 'email', 'email', ${usuario.email}, null, true, false, false, null, null, 'bi-envelope', null)}"></div>
                <div class="col-md-4" th:insert="~{components/input :: input('CPF', 'cpf', 'cpf', 'text', ${usuario.cpf}, null, true, false, true, null, 'O CPF não pode ser alterado.', null, null)}"></div>
                <div class="col-md-4" th:insert="~{components/input :: input('Telefone', 'telefone', 'telefone', 'text', ${usuario.telefone}, '(00) 00000-0000', false, false, false, null, null, 'bi-telephone', null)}"></div>
                <div class="col-md-4" th:insert="~{components/input :: input('Data de Nascimento', 'dataNascimento', 'dataNascimento', 'date', '', null, false, false, false, null, null, null, null)}"></div>
                <div class="col-md-4" th:insert="~{components/dropdown :: select('Sexo', 'sexo', 'sexo', ${ {'', 'MASCULINO', 'FEMININO', 'OUTRO'} }, '', false, false, null)}"></div>
            </div>
        </section>

        <section class="dashboard-panel mb-4" aria-labelledby="perfilStatusTitulo">
            <div class="panel-heading">
                <div>
                    <span class="panel-icon"><i class="bi bi-shield-check" aria-hidden="true"></i></span>
                    <h2 id="perfilStatusTitulo">Perfil e Status</h2>
                    <p>Acesso e aprovação do usuário.</p>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-4" th:insert="~{components/dropdown :: select('Perfil', 'perfil', 'perfil', ${ {'GESTOR', 'SECRETARIA', 'PROFESSOR', 'FINANCEIRO'} }, ${usuario.perfil.name()}, true, false, null)}"></div>
                <div class="col-md-4" th:insert="~{components/dropdown :: select('Status da Conta', 'aprovado', 'aprovado', ${ {'true', 'false'} }, ${usuario.ativo ? 'true' : 'false'}, true, false, null)}"></div>
            </div>
        </section>

        <section class="dashboard-panel mb-4" aria-labelledby="enderecoTitulo">
            <div class="panel-heading">
                <div>
                    <span class="panel-icon"><i class="bi bi-geo-alt" aria-hidden="true"></i></span>
                    <h2 id="enderecoTitulo">Endereço residencial</h2>
                    <p>Informações complementares de localização.</p>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-3" th:insert="~{components/input :: input('CEP', 'cep', 'cep', 'text', '', '00000-000', false, false, false, null, null, null, null)}"></div>
                <div class="col-md-6" th:insert="~{components/input :: input('Logradouro', 'endereco', 'endereco', 'text', '', 'Endereço', false, false, false, null, null, 'bi-signpost', null)}"></div>
                <div class="col-md-3" th:insert="~{components/input :: input('Complemento', 'complemento', 'complemento', 'text', '', null, false, false, false, null, null, null, null)}"></div>
                <div class="col-md-4" th:insert="~{components/input :: input('Bairro', 'bairro', 'bairro', 'text', '', null, false, false, false, null, null, null, null)}"></div>
                <div class="col-md-5" th:insert="~{components/input :: input('Cidade', 'cidade', 'cidade', 'text', '', null, false, false, false, null, null, null, null)}"></div>
                <div class="col-md-3" th:insert="~{components/input :: input('Estado (UF)', 'estado', 'estado', 'text', '', null, false, false, false, null, null, null, null)}"></div>
            </div>
        </section>

        <div class="d-flex justify-content-end gap-2">
            <div th:replace="~{components/button :: button('Cancelar', 'bi-x-circle', 'secondary', 'md', false, false, 'button', '/dashboard/usuarios')}"></div>
            <div th:replace="~{components/button :: button('Salvar Alterações', 'bi-save', 'primary', 'md', false, false, 'submit', null)}"></div>
        </div>
    </form>

    <script src="/js/pages/usuario-form.js"></script>
</div>

</body>
</html>

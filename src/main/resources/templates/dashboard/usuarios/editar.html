<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/master-admin :: html}">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuário - SYNGE</title>
</head>
<body>
<div th:fragment="content">

    <nav class="breadcrumb-admin">
        <a href="/dashboard" class="text-decoration-none" style="color: var(--color-primary);">Dashboard</a>
        <span class="mx-2">></span>
        <a href="/dashboard/usuarios" class="text-decoration-none" style="color: var(--color-primary);">Usuários</a>
        <span class="mx-2">></span>
        <span class="text-muted">Editar Usuário</span>
    </nav>

    <h1 class="page-title">Editar Usuário</h1>

    <div class="form-container bg-white p-4 rounded-3 shadow-sm">
        <form th:action="@{/dashboard/usuarios/atualizar/{id}(id=${usuario.id})}" method="POST">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">Nome Completo *</label>
                        <input type="text" class="form-control" name="nomeCompleto" th:value="${usuario.nomeCompleto}" required placeholder="Digite o nome completo">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">Email *</label>
                        <input type="email" class="form-control" name="email" th:value="${usuario.email}" required placeholder="Digite o email">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">CPF *</label>
                        <input type="text" class="form-control" name="cpf" th:value="${usuario.cpf}" required placeholder="000.000.000-00">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">Telefone</label>
                        <input type="text" class="form-control" name="telefone" th:value="${usuario.telefone}" placeholder="(00) 00000-0000">
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">Perfil de Acesso *</label>
                        <select class="form-select" name="perfil" required>
                            <option value="SUPER_ADMIN" th:selected="${usuario.perfil.name() == 'SUPER_ADMIN'}">Super Admin</option>
                            <option value="GESTOR" th:selected="${usuario.perfil.name() == 'GESTOR'}">Gestor</option>
                            <option value="PROFESSOR" th:selected="${usuario.perfil.name() == 'PROFESSOR'}">Professor</option>
                            <option value="SECRETARIA" th:selected="${usuario.perfil.name() == 'SECRETARIA'}">Secretária</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label fw-semibold small">Escola</label>
                        <input type="text" class="form-control" th:value="${escolaNome}" disabled>
                    </div>
                </div>
            </div>

            <div class="metadata-row d-flex gap-4 p-3 bg-light rounded mb-4" style="font-size: 13px; color: #666;">
                <div class="metadata-item">
                    <span class="fw-semibold">Cadastrado em:</span>
                    <span th:text="${#temporals.format(usuario.criadoEm, 'dd/MM/yyyy HH:mm')}">10/01/2024 às 14:30</span>
                </div>
                <div class="metadata-item" th:if="${usuario.atualizadoEm != null}">
                    <span class="fw-semibold">Última atualização:</span>
                    <span th:text="${#temporals.format(usuario.atualizadoEm, 'dd/MM/yyyy HH:mm')}">15/01/2024 às 09:15</span>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                <a href="/dashboard/usuarios" class="btn btn-outline-secondary px-4">Cancelar</a>
                <button type="submit" class="btn text-white px-4" style="background-color: var(--color-accent);">
                    <i class="bi bi-check-lg me-1"></i> Atualizar Usuário
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>

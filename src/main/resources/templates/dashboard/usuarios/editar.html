<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/master-admin :: html}">

<div th:fragment="content">

    <!-- Breadcrumb -->
    <nav class="breadcrumb-admin mb-4">
        <a href="/dashboard" class="text-decoration-none">Dashboard</a>
        <span class="mx-2">></span>

        <a href="/dashboard/usuarios" class="text-decoration-none">
            Usuários
        </a>

        <span class="mx-2">></span>

        <span class="text-muted">Editar Usuário</span>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="page-title mb-1">
                <i class="bi bi-pencil-square text-warning"></i>
                Editar Usuário
            </h2>

            <p class="text-muted">
                Atualize as informações do usuário.
            </p>
        </div>

        <a href="/dashboard/usuarios"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left"></i>
            Voltar

        </a>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <form>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Nome Completo
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                value="Maria Santos Silva">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Email
                        </label>

                        <input
                                type="email"
                                class="form-control"
                                value="maria@email.com">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            CPF
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                value="123.456.789-00">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Telefone
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                value="(11)99999-9999">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Escola
                        </label>

                        <select class="form-select">
                            <option>Colégio SYNGE</option>
                            <option selected>Escola Estadual João</option>
                            <option>Escola Primavera</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Perfil
                        </label>

                        <select class="form-select">
                            <option>SUPER_ADMIN</option>
                            <option selected>GESTOR</option>
                            <option>SECRETARIA</option>
                            <option>PROFESSOR</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Status
                        </label>

                        <select class="form-select">
                            <option selected>ATIVO</option>
                            <option>INATIVO</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Aprovação
                        </label>

                        <select class="form-select">
                            <option selected>APROVADO</option>
                            <option>PENDENTE</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Nova Senha
                        </label>

                        <input
                                type="password"
                                class="form-control"
                                placeholder="Deixe vazio para não alterar">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Confirmar Nova Senha
                        </label>

                        <input
                                type="password"
                                class="form-control"
                                placeholder="********">
                    </div>

                    <div class="col-12 mb-3">

                        <label class="form-label">
                            Observações
                        </label>

                        <textarea
                                rows="4"
                                class="form-control">Usuário cadastrado pelo Super Administrador.</textarea>

                    </div>

                </div>

                <hr>

                <div class="d-flex justify-content-between">

                    <button
                            type="button"
                            class="btn btn-danger"
                            onclick="confirmarRemocao()">

                        <i class="bi bi-trash"></i>

                        Remover Usuário

                    </button>

                    <div class="d-flex gap-2">

                        <a href="/dashboard/usuarios"
                           class="btn btn-secondary">

                            Cancelar

                        </a>

                        <button
                                type="submit"
                                class="btn btn-warning">

                            <i class="bi bi-check-circle"></i>

                            Salvar Alterações

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

<script>
    function confirmarRemocao() {
        if (confirm('Tem a certeza absoluta de que deseja REMOVER este usuário? Esta ação não pode ser desfeita.')) {
            // Cria um formulário invisível para disparar o DELETE para o backend
            const form = document.createElement('form');
            form.method = 'POST';
            // Altere para a rota correta que remove o utilizador no seu Javalin (ex: /users/id ou rota de dashboard)
            form.action = window.location.pathname.replace('/dashboard/usuarios/editar', '/users');

            // Campo oculto para simular o DELETE no Javalin
            const methodInput = document.createElement('input');
            methodInput.type = 'hidden';
            methodInput.name = '_method';
            methodInput.value = 'DELETE';

            form.appendChild(methodInput);
            document.body.appendChild(form);
            form.submit();
        }
    }
</script>

</html>

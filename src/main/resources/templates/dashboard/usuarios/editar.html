<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Usuário - SYNGE</title>
</head>
<body>

<div th:fragment="content">
    <nav class="breadcrumb-admin mb-4">
        <a href="/dashboard" class="text-decoration-none">Dashboard</a>
        <span class="mx-2">></span>
        <a href="/dashboard/usuarios" class="text-decoration-none">Usuários</a>
        <span class="mx-2">></span>
        <span class="text-muted">Editar Usuário</span>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="page-title mb-1">
                <i class="bi bi-pencil-square text-warning me-2"></i>Editar Usuário
            </h2>
            <small class="text-muted">Modifique as informações cadastrais e atualize os registros do usuário.</small>
        </div>
        <a href="/dashboard/usuarios" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0"><i class="bi bi-person-gear me-2"></i>Atualizar Cadastro</h5>
        </div>
        <div class="card-body p-4">
            <form th:action="'/dashboard/usuarios/editar/' + ${usuario.id}" method="post">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Nome Completo</label>
                        <input type="text" class="form-control" name="nomeCompleto" th:value="${usuario.nomeCompleto}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">E-mail</label>
                        <input type="email" class="form-control" name="email" th:value="${usuario.email}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">CPF</label>
                        <input type="text" class="form-control bg-light" name="cpf" th:value="${usuario.cpf}" readonly>
                        <div class="form-text small">O CPF não pode ser alterado.</div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Telefone</label>
                        <input type="text" class="form-control" name="telefone" th:value="${usuario.telefone}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Data de Nascimento</label>
                        <input type="date" class="form-control" name="dataNascimento">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Sexo</label>
                        <select class="form-select" name="sexo">
                            <option value="MASCULINO">Masculino</option>
                            <option value="FEMININO">Feminino</option>
                            <option value="OUTRO">Outro</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Perfil de Acesso</label>
                        <select class="form-select" name="perfil" required>
                            <option value="GESTOR" th:selected="${usuario.perfil.toString() == 'GESTOR'}">GESTOR</option>
                            <option value="SECRETARIO" th:selected="${usuario.perfil.toString() == 'SECRETARIO'}">SECRETÁRIO</option>
                            <option value="PROFESSOR" th:selected="${usuario.perfil.toString() == 'PROFESSOR'}">PROFESSOR</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Status da Conta</label>
                        <select class="form-select" name="aprovado">
                            <option value="true" th:selected="${usuario.aprovado}">Ativo / Aprovado</option>
                            <option value="false" th:selected="${!usuario.aprovado}">Inativo / Pendente</option>
                        </select>
                    </div>
                </div>

                <h6 class="text-success fw-bold mt-4 mb-3"><i class="bi bi-geo-alt me-2"></i>Informações de Endereço</h6>

                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-semibold">CEP</label>
                        <input type="text" class="form-control" name="cep">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Logradouro (Endereço)</label>
                        <input type="text" class="form-control" name="endereco">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-semibold">Complemento</label>
                        <input type="text" class="form-control" name="complemento">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Bairro</label>
                        <input type="text" class="form-control" name="bairro">
                    </div>
                    <div class="col-md-5 mb-3">
                        <label class="form-label fw-semibold">Cidade</label>
                        <input type="text" class="form-control" name="cidade">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-semibold">Estado (UF)</label>
                        <input type="text" class="form-control" name="estado" maxlength="2">
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">
                    <a href="/dashboard/usuarios" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-warning text-dark fw-bold px-4">
                        <i class="bi bi-check-circle me-1"></i> Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>

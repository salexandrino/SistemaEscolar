<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/master-escola :: html(~{::content})}">

<head>
    <title>Gestão de Turmas</title>
</head>

<body>

<div th:fragment="content">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item active">Turmas</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Gestão de Turmas</h1>

        <a th:if="${canEdit}"
           href="/portal/turmas/novo"
           class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>
            Nova Turma
        </a>

    </div>

    <div id="alerta" class="alert" role="alert" style="display:none;"></div>

    <div class="card mt-4">

        <div class="card-header">
            <h5 class="card-title mb-0">
                Lista de Turmas
            </h5>
        </div>

        <div class="card-body">

            <div id="loadingState" class="text-center p-4">

                <div class="spinner-border text-primary"></div>

                <p class="mt-2">
                    Carregando turmas...
                </p>

            </div>

            <div id="emptyState" class="text-center p-4 d-none">

                <i class="bi bi-journal-x fs-1 text-muted"></i>

                <p class="mt-2 text-muted">
                    Nenhuma turma encontrada.
                </p>

                <a th:if="${canEdit}"
                   href="/portal/turmas/novo"
                   class="btn btn-primary btn-sm mt-2">
                    Cadastrar Primeira Turma
                </a>

            </div>

            <div id="tableContainer" class="table-responsive d-none">

                <table id="tabelaTurmas"
                       class="table table-striped table-hover">

                    <thead>

                    <tr>
                        <th>Nome da Turma</th>
                        <th>Turno</th>
                        <th>Sala</th>
                        <th>Capacidade</th>
                        <th>Situação</th>
                        <th class="text-end">Ações</th>
                    </tr>

                    </thead>

                    <tbody></tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script th:inline="javascript">

    const canEdit = /*[[${canEdit}]]*/ false;

    document.addEventListener("DOMContentLoaded", () => {

        const tbody = document.querySelector("#tabelaTurmas tbody");
        const loading = document.getElementById("loadingState");
        const empty = document.getElementById("emptyState");
        const table = document.getElementById("tableContainer");

        function alerta(msg, tipo="success"){

            const a=document.getElementById("alerta");

            a.className=`alert alert-${tipo} alert-dismissible fade show`;

            a.innerHTML=
                `${msg}
        <button class="btn-close"
                data-bs-dismiss="alert"></button>`;

            a.style.display="block";

        }

        function mostrarLoading(){

            loading.classList.remove("d-none");
            table.classList.add("d-none");
            empty.classList.add("d-none");

        }

        function mostrarTabela(){

            loading.classList.add("d-none");
            empty.classList.add("d-none");
            table.classList.remove("d-none");

        }

        function mostrarVazio(){

            loading.classList.add("d-none");
            table.classList.add("d-none");
            empty.classList.remove("d-none");

        }

        async function carregarTurmas(){

            mostrarLoading();

            tbody.innerHTML="";

            try{

                const response=await fetch("/api/academico/turmas", { credentials: 'include' });

                if(!response.ok)
                    throw new Error("Erro ao carregar turmas: " + response.status);

                const contentType = response.headers.get('content-type') || '';
                if (!contentType.includes('application/json')) {
                    throw new Error('Resposta inesperada do servidor (não-JSON). Provável redirect para login.');
                }

                const turmas=await response.json();

                if(!Array.isArray(turmas) || turmas.length===0){

                    mostrarVazio();
                    return;

                }

                const turnos={
                    MATUTINO:"Matutino",
                    VESPERTINO:"Vespertino",
                    NOTURNO:"Noturno",
                    INTEGRAL:"Integral"
                };

                turmas.forEach(turma=>{

                    const badge=turma.situacao==="ATIVA"
                        ? "bg-success"
                        : "bg-secondary";

                    let acoes=`
                    <a href="/portal/turmas/visualizar?id=${turma.id}"
                       class="btn btn-sm btn-outline-secondary">
                       <i class="bi bi-eye"></i>
                    </a>
                `;

                    if(canEdit){

                        acoes+=`
                    <a href="/portal/turmas/editar?id=${turma.id}"
                       class="btn btn-sm btn-outline-primary ms-1">
                       <i class="bi bi-pencil"></i>
                    </a>

                    <button class="btn btn-sm btn-outline-danger ms-1"
                            onclick="apagarTurma('${turma.id}')">
                        <i class="bi bi-trash"></i>
                    </button>`;
                    }

                    tbody.innerHTML+=`
                <tr>
                    <td>${turma.nome}</td>
                    <td>${turnos[turma.turno] ?? turma.turno}</td>
                    <td>${turma.sala ?? "N/A"}</td>
                    <td>${turma.capacidade}</td>
                    <td>
                        <span class="badge ${badge}">
                            ${turma.situacao}
                        </span>
                    </td>
                    <td class="text-end">
                        ${acoes}
                    </td>
                </tr>`;

                });

                mostrarTabela();

            }

            catch(e){

                alerta(e.message,"danger");
                mostrarVazio();

            }

        }

        window.apagarTurma=async(id)=>{

            if(!await confirmarAcao("Deseja realmente apagar esta turma?", 'Confirmar exclusão', 'Excluir'))
                return;

            const response=await fetch(`/api/academico/turmas/${id}`,{
                method:"DELETE",
                credentials: 'include'
            });

            if(response.status===204){

                alerta("Turma apagada com sucesso.");
                carregarTurmas();

            }else{

                alerta("Erro ao apagar turma.","danger");

            }

        }

        carregarTurmas();

    });

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/master-admin :: html}">
    <span th:text="${escola.nome}"></span>

    <span th:text="${escola.cnpj}"></span>

    <span th:text="${escola.emailInstitucional}"></span>

    <span th:text="${escola.status}"></span>
<div th:fragment="content">

    <!-- Breadcrumb -->
    <nav class="breadcrumb-admin mb-4">
        <a href="/dashboard" class="text-decoration-none">Dashboard</a>
        <span class="mx-2">></span>

        <a href="/dashboard/escolas" class="text-decoration-none">
            Escolas
        </a>

        <span class="mx-2">></span>

        <span class="text-muted">Visualizar</span>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0">
            <i class="bi bi-building me-2"></i>
            Visualizar Escola
        </h2>

        <div>
            <a href="/dashboard/escolas"
               class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i>
                Voltar
            </a>

            <a href="/dashboard/escolas/editar/1"
               class="btn btn-warning">
                <i class="bi bi-pencil"></i>
                Editar
            </a>
        </div>
    </div>

    <div class="card shadow-sm">

        <div class="card-header bg-success text-white">
            <h5 class="mb-0">
                Dados da Escola
            </h5>
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Nome</label>

                    <div class="form-control bg-light">
                        Colégio Estadual SYNGE
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="fw-bold">CNPJ</label>

                    <div class="form-control bg-light">
                        12.345.678/0001-90
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Email</label>

                    <div class="form-control bg-light">
                        contato@synge.com.br
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Telefone</label>

                    <div class="form-control bg-light">
                        (11) 99999-9999
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="fw-bold">Cidade</label>

                    <div class="form-control bg-light">
                        São Paulo
                    </div>
                </div>

                <div class="col-md-2 mb-3">
                    <label class="fw-bold">UF</label>

                    <div class="form-control bg-light">
                        SP
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Responsável</label>

                    <div class="form-control bg-light">
                        Carlos Alberto
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Status</label>

                    <div class="form-control bg-light">

                        <span class="badge bg-success fs-6">
                            ATIVA
                        </span>

                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="fw-bold">Data de Cadastro</label>

                    <div class="form-control bg-light">
                        10/05/2026
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

</html>

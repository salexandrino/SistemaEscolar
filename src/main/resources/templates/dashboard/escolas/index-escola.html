<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/master-admin :: html}">

<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Escolas</h2>
        <a href="/dashboard/escolas/nova" class="btn btn-success">
            <i class="bi bi-building-add"></i> Nova Escola
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>CNPJ</th>
                        <th>Cidade</th>
                        <th>Responsável</th>
                        <th>Status</th>
                        <th width="180">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="escola : ${escolas}">
                        <td th:text="${escola.nome}">Nome</td>
                        <td th:text="${escola.cnpj}">CNPJ</td>
                        <td>
                            <span th:text="${escola.cidade}">Cidade</span> /
                            <span th:text="${escola.estado}">UF</span>
                        </td>
                        <td th:text="${escola.responsavel != null ? escola.responsavel : 'Não atribuído'}">Responsável</td>
                        <td>
                            <span class="badge bg-success" th:if="${escola.status == 'ATIVA'}">ATIVA</span>
                            <span class="badge bg-danger" th:if="${escola.status == 'INATIVA'}">INATIVA</span>
                        </td>
                        <td>
                            <a th:href="@{/dashboard/escolas/visualizar/{id}(id=${escola.id})}" class="btn btn-primary btn-sm">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/dashboard/escolas/editar/{id}(id=${escola.id})}" class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(escolas)}">
                        <td colspan="6" class="text-center py-4 text-muted">
                            Nenhuma escola cadastrada.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/master-admin :: html}">
<head>
    <meta charset="UTF-8">
    <title>Nova Escola - SYNGE</title>
</head>
<body>
<div th:fragment="content">

    <nav class="breadcrumb-admin">
        <a href="/dashboard" class="text-decoration-none" style="color: var(--color-primary);">Dashboard</a>
        <span class="mx-2">></span>
        <a href="/dashboard/escolas" class="text-decoration-none" style="color: var(--color-primary);">Escolas</a>
        <span class="mx-2">></span>
        <span class="text-muted">Nova Escola</span>
    </nav>

    <h1 class="page-title">Nova Escola</h1>

    <div class="form-container bg-white p-4 rounded-3 shadow-sm">
        <form action="/dashboard/escolas/salvar" method="POST">

            <h5 class="fw-bold mb-3" style="color: var(--color-primary);">Dados da Instituição</h5>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small">Nome da Escola *</label>
                    <input type="text" class="form-control" name="nome" required placeholder="Ex: Colégio Estadual Synge">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small">CNPJ *</label>
                    <input type="text" class="form-control" name="cnpj" required placeholder="00.000.000/0000-00">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small">Email Institucional *</label>
                    <input type="email" class="form-control" name="emailInstitucional" required placeholder="escola@email.com">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small">Telefone *</label>
                    <input type="text" class="form-control" name="telefone" required placeholder="(00) 0000-0000">
                </div>
            </div>

            <h5 class="fw-bold mt-4 mb-3" style="color: var(--color-primary);">Localização / Endereço</h5>
            <div class="row">
                <div class="col-md-5 mb-3">
                    <label class="form-label fw-semibold small">Endereço *</label>
                    <input type="text" class="form-control" name="endereco" required placeholder="Rua, Avenida...">
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label fw-semibold small">Número *</label>
                    <input type="text" class="form-control" name="numero" required placeholder="Nº">
                </div>
                <div class="col-md-5 mb-3">
                    <label class="form-label fw-semibold small">Complemento</label>
                    <input type="text" class="form-control" name="complemento" placeholder="Sala, Bloco...">
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold small">Bairro *</label>
                    <input type="text" class="form-control" name="bairro" required placeholder="Bairro">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold small">Cidade *</label>
                    <input type="text" class="form-control" name="cidade" required placeholder="Cidade">
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label fw-semibold small">Estado (UF) *</label>
                    <input type="text" class="form-control" name="estado" maxlength="2" required placeholder="EX: SP">
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label fw-semibold small">CEP *</label>
                    <input type="text" class="form-control" name="cep" required placeholder="00000-000">
                </div>
            </div>

            <h5 class="fw-bold mt-4 mb-3" style="color: var(--color-primary);">Responsável pela Escola</h5>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold small">Nome do Responsável *</label>
                    <input type="text" class="form-control" name="nomeResponsavel" required placeholder="Nome do Diretor/Gestor">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold small">Email do Responsável *</label>
                    <input type="email" class="form-control" name="emailResponsavel" required placeholder="diretor@email.com">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold small">Telefone do Responsável *</label>
                    <input type="text" class="form-control" name="telefoneResponsavel" required placeholder="(00) 99999-9999">
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                <a href="/dashboard/escolas" class="btn btn-outline-secondary px-4">Cancelar</a>
                <button type="submit" class="btn text-white px-4" style="background-color: var(--color-accent);">
                    <i class="bi bi-save me-1"></i> Salvar Escola
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>

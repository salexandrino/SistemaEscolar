<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/master-admin :: html}">

<head>
    <title>Nova Escola - SYNGE</title>
</head>

<body>

<div th:fragment="content">

    <!-- Breadcrumb -->
    <nav class="breadcrumb-admin mb-4">
        <a href="/dashboard">Dashboard</a>
        <span class="mx-2">></span>
        <a href="/dashboard/escolas">Escolas</a>
        <span class="mx-2">></span>
        <span>Nova Escola</span>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="page-title mb-1">
                <i class="bi bi-building-add"></i>
                Nova Escola
            </h2>
            <small class="text-muted">
                Cadastre uma nova instituição no sistema.
            </small>
        </div>

        <a href="/dashboard/escolas" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
            Voltar
        </a>
    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <form>

                <div class="row">

                    <div class="col-md-8 mb-3">
                        <label class="form-label">
                            Nome da Escola
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                placeholder="Ex.: Colégio SYNGE">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            CNPJ
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                placeholder="00.000.000/0001-00">
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Email
                        </label>

                        <input
                                type="email"
                                class="form-control"
                                placeholder="contato@escola.com.br">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Telefone
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                placeholder="(00) 00000-0000">
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-8 mb-3">
                        <label class="form-label">
                            Endereço
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                placeholder="Rua, número, bairro">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            CEP
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                placeholder="00000-000">
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Cidade
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                placeholder="Cidade">
                    </div>

                    <div class="col-md-2 mb-3">
                        <label class="form-label">
                            UF
                        </label>

                        <select class="form-select">
                            <option>AC</option>
                            <option>AL</option>
                            <option>AP</option>
                            <option>AM</option>
                            <option>BA</option>
                            <option>CE</option>
                            <option>DF</option>
                            <option>ES</option>
                            <option>GO</option>
                            <option>MA</option>
                            <option>MT</option>
                            <option>MS</option>
                            <option>MG</option>
                            <option>PA</option>
                            <option>PB</option>
                            <option>PR</option>
                            <option>PE</option>
                            <option>PI</option>
                            <option>RJ</option>
                            <option>RN</option>
                            <option>RS</option>
                            <option>RO</option>
                            <option>RR</option>
                            <option>SC</option>
                            <option>SP</option>
                            <option>SE</option>
                            <option>TO</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Responsável
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                placeholder="Nome do responsável">
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-4">
                        <label class="form-label">
                            Status Inicial
                        </label>

                        <select class="form-select">
                            <option selected>ATIVA</option>
                            <option>INATIVA</option>
                        </select>
                    </div>

                </div>

                <hr>

                <div class="d-flex justify-content-end gap-2">

                    <a href="/dashboard/escolas"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button
                            type="submit"
                            class="btn btn-success">

                        <i class="bi bi-check-circle"></i>

                        Cadastrar Escola

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>

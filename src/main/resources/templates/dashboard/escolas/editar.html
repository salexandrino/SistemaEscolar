<form
        th:action="@{/escolas/{id}(id=${escola.id})}"
        method="post">

    <!-- Spring HiddenHttpMethodFilter -->
    <input type="hidden" name="_method" value="PATCH">

    <div class="row">

        <div class="col-md-8 mb-3">
            <label class="form-label">Nome da Escola</label>

            <input
                    type="text"
                    class="form-control"
                    name="nome"
                    th:value="${escola.nome}"
                    required>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label">CNPJ</label>

            <input
                    type="text"
                    class="form-control"
                    name="cnpj"
                    th:value="${escola.cnpj}"
                    required>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Responsável</label>

            <input
                    type="text"
                    class="form-control"
                    name="nomeResponsavel"
                    th:value="${escola.nomeResponsavel}">
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Email Institucional</label>

            <input
                    type="email"
                    class="form-control"
                    name="emailInstitucional"
                    th:value="${escola.emailInstitucional}">
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label">Telefone</label>

            <input
                    type="text"
                    class="form-control"
                    name="telefone"
                    th:value="${escola.telefone}">
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label">Cidade</label>

            <input
                    type="text"
                    class="form-control"
                    name="cidade"
                    th:value="${escola.cidade}">
        </div>

        <div class="col-md-4 mb-3">

            <label class="form-label">UF</label>

            <select
                    class="form-select"
                    name="estado">

                <option value="AC" th:selected="${escola.estado=='AC'}">AC</option>
                <option value="AL" th:selected="${escola.estado=='AL'}">AL</option>
                <option value="AP" th:selected="${escola.estado=='AP'}">AP</option>
                <option value="AM" th:selected="${escola.estado=='AM'}">AM</option>
                <option value="BA" th:selected="${escola.estado=='BA'}">BA</option>
                <option value="CE" th:selected="${escola.estado=='CE'}">CE</option>
                <option value="DF" th:selected="${escola.estado=='DF'}">DF</option>
                <option value="ES" th:selected="${escola.estado=='ES'}">ES</option>
                <option value="GO" th:selected="${escola.estado=='GO'}">GO</option>
                <option value="MA" th:selected="${escola.estado=='MA'}">MA</option>
                <option value="MT" th:selected="${escola.estado=='MT'}">MT</option>
                <option value="MS" th:selected="${escola.estado=='MS'}">MS</option>
                <option value="MG" th:selected="${escola.estado=='MG'}">MG</option>
                <option value="PA" th:selected="${escola.estado=='PA'}">PA</option>
                <option value="PB" th:selected="${escola.estado=='PB'}">PB</option>
                <option value="PR" th:selected="${escola.estado=='PR'}">PR</option>
                <option value="PE" th:selected="${escola.estado=='PE'}">PE</option>
                <option value="PI" th:selected="${escola.estado=='PI'}">PI</option>
                <option value="RJ" th:selected="${escola.estado=='RJ'}">RJ</option>
                <option value="RN" th:selected="${escola.estado=='RN'}">RN</option>
                <option value="RS" th:selected="${escola.estado=='RS'}">RS</option>
                <option value="RO" th:selected="${escola.estado=='RO'}">RO</option>
                <option value="RR" th:selected="${escola.estado=='RR'}">RR</option>
                <option value="SC" th:selected="${escola.estado=='SC'}">SC</option>
                <option value="SP" th:selected="${escola.estado=='SP'}">SP</option>
                <option value="SE" th:selected="${escola.estado=='SE'}">SE</option>
                <option value="TO" th:selected="${escola.estado=='TO'}">TO</option>

            </select>

        </div>

    </div>

    <hr>

    <h5>Status da Escola</h5>

    <div class="d-flex align-items-center gap-3">

        <span class="fw-bold"
              th:text="${escola.status}">
        </span>

        <!-- Botão Ativar -->
        <form
                th:if="${escola.status.name() == 'INATIVA'}"
                th:action="@{/escolas/{id}/ativar(id=${escola.id})}"
                method="post">

            <input type="hidden" name="_method" value="PATCH">

            <button class="btn btn-success">

                <i class="bi bi-check-circle"></i>

                Ativar Escola

            </button>

        </form>

        <!-- Botão Inativar -->
        <form
                th:if="${escola.status.name() == 'ATIVA'}"
                th:action="@{/escolas/{id}/inativar(id=${escola.id})}"
                method="post">

            <input type="hidden" name="_method" value="PATCH">

            <button
                    class="btn btn-danger"
                    onclick="return confirm('Deseja realmente inativar esta escola?')">

                <i class="bi bi-x-circle"></i>

                Inativar Escola

            </button>

        </form>

    </div>

    <hr>

    <div class="d-flex justify-content-end gap-2">

        <a
                href="/dashboard/escolas"
                class="btn btn-outline-secondary">

            Cancelar

        </a>

        <button
                type="submit"
                class="btn btn-success">

            <i class="bi bi-save"></i>

            Salvar Alterações

        </button>

    </div>

</form>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/master-admin :: html}">
<head>
    <meta charset="UTF-8">
    <title>Editar Escola - SYNGE</title>
</head>
<body>
<div th:fragment="content">

    <nav class="breadcrumb-admin">
        <a href="/dashboard" class="text-decoration-none" style="color: var(--color-primary);">Dashboard</a>
        <span class="mx-2">></span>
        <a href="/dashboard/escolas" class="text-decoration-none" style="color: var(--color-primary);">Escolas</a>
        <span class="mx-2">></span>
        <span class="text-muted">Editar Escola</span>
    </nav>

    <h1 class="page-title">Editar Escola</h1>

    <div class="form-container bg-white p-4 rounded-3 shadow-sm">
        <form th:action="@{/dashboard/escolas/atualizar/{id}(id=${escola.id})}" method="POST">

            <h5 class="fw-bold mb-3" style="color: var(--color-primary);">Dados da Instituição</h5>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small">Nome da Escola *</label>
                    <input type="text" class="form-control" name="nome" th:value="${escola.nome}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small">CNPJ *</label>
                    <input type="text" class="form-control" name="cnpj" th:value="${escola.cnpj}" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small">Email Institucional *</label>
                    <input type="email" class="form-control" name="emailInstitucional" th:value="${escola.emailInstitucional}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold small">Telefone *</label>
                    <input type="text" class="form-control" name="telefone" th:value="${escola.telefone}" required>
                </div>
            </div>

            <h5 class="fw-bold mt-4 mb-3" style="color: var(--color-primary);">Localização e Status</h5>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold small">Cidade *</label>
                    <input type="text" class="form-control" name="cidade" th:value="${escola.cidade}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold small">Estado (UF) *</label>
                    <input type="text" class="form-control" name="estado" th:value="${escola.estado}" maxlength="2" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold small">Status *</label>
                    <select class="form-select" name="status" required>
                        <option value="ATIVA" th:selected="${escola.status == 'ATIVA'}">ATIVA</option>
                        <option value="INATIVA" th:selected="${escola.status == 'INATIVA'}">INATIVA</option>
                    </select>
                </div>
            </div>

            <div class="metadata-row d-flex gap-4 p-3 bg-light rounded mb-4" style="font-size: 13px; color: #666;">
                <div class="metadata-item">
                    <span class="fw-semibold">Cadastrado em:</span>
                    <span th:text="${#temporals.format(escola.criadoEm, 'dd/MM/yyyy HH:mm')}">05/01/2024 às 10:00</span>
                </div>
                <div class="metadata-item" th:if="${escola.atualizadoEm != null}">
                    <span class="fw-semibold">Última atualização:</span>
                    <span th:text="${#temporals.format(escola.atualizadoEm, 'dd/MM/yyyy HH:mm')}">15/01/2024 às 09:15</span>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                <a href="/dashboard/escolas" class="btn btn-outline-secondary px-4">Cancelar</a>
                <button type="submit" class="btn text-white px-4" style="background-color: var(--color-accent);">
                    <i class="bi bi-check-lg me-1"></i> Atualizar Escola
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>

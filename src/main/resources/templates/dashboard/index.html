<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SYNGE - Dashboard</title>
</head>
<body>

<div th:fragment="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <h1 class="h2 mb-4">Painel Super Admin</h1>

                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 bg-white p-3 rounded-3">
                            <span class="text-muted small">Total de Escolas</span>
                            <h3 class="fw-bold text-success mt-1" th:text="${dashboard != null ? dashboard.totalEscolas : 0}">0</h3>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 bg-white p-3 rounded-3">
                            <span class="text-muted small">Escolas Ativas</span>
                            <h3 class="fw-bold text-success mt-1" th:text="${dashboard != null ? dashboard.escolasAtivas : 0}">0</h3>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 bg-white p-3 rounded-3">
                            <span class="text-muted small">Total de Usuários</span>
                            <h3 class="fw-bold text-success mt-1" th:text="${dashboard != null ? dashboard.totalUsuarios : 0}">0</h3>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 bg-white p-3 rounded-3">
                            <span class="text-muted small">Usuários Pendentes</span>
                            <h3 class="fw-bold text-warning mt-1" th:text="${dashboard != null ? dashboard.usuariosPendentes : 0}">0</h3>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>

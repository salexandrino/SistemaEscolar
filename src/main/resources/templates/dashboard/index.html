<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNGE - Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fb;
        }

        .sidebar{
            background:#0d6efd;
            min-height:100vh;
            color:white;
        }

        .sidebar a{
            color:white;
            text-decoration:none;
            display:block;
            padding:12px;
            border-radius:8px;
            margin-bottom:8px;
            transition:.2s;
        }

        .sidebar a:hover{
            background:rgba(255,255,255,.2);
        }

        .card-dashboard{
            border:none;
            border-radius:15px;
            box-shadow:0 8px 25px rgba(0,0,0,.08);
        }

        .numero{
            font-size:40px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-2 sidebar p-4">

            <h3>SYNGE</h3>

            <hr>

            <a href="/dashboard">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>

            <a href="/dashboard/escolas">
                <i class="bi bi-building"></i>
                Escolas
            </a>

            <a href="/dashboard/usuarios">
                <i class="bi bi-people"></i>
                Usuários
            </a>

            <hr>

            <form action="/auth/logout" method="post">
                <button class="btn btn-light w-100">
                    Sair
                </button>
            </form>

        </div>

        <div class="col-md-10 p-4">

            <h2>Dashboard Administrativo</h2>

            <p class="text-muted">
                Teste das rotas do sistema.
            </p>

            <div class="row mt-4">

                <div class="col-md-4">

                    <div class="card card-dashboard">
                        <div class="card-body text-center">

                            <i class="bi bi-building fs-1 text-primary"></i>

                            <h5 class="mt-3">Escolas</h5>

                            <div class="numero"
                                 th:text="${dashboard.totalEscolas}">
                                0
                            </div>

                            <a href="/dashboard/escolas"
                               class="btn btn-primary mt-3">
                                Abrir
                            </a>

                        </div>
                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card card-dashboard">
                        <div class="card-body text-center">

                            <i class="bi bi-person-check fs-1 text-success"></i>

                            <h5 class="mt-3">Usuários</h5>

                            <div class="numero"
                                 th:text="${dashboard.totalUsuarios}">
                                0
                            </div>

                            <a href="/dashboard/usuarios"
                               class="btn btn-success mt-3">
                                Abrir
                            </a>

                        </div>
                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card card-dashboard">
                        <div class="card-body text-center">

                            <i class="bi bi-person-clock fs-1 text-warning"></i>

                            <h5 class="mt-3">Pendentes</h5>

                            <div class="numero"
                                 th:text="${dashboard.usuariosPendentes}">
                                0
                            </div>

                        </div>
                    </div>

                </div>

            </div>

            <div class="card card-dashboard mt-5">

                <div class="card-body">

                    <h4>Resumo do Sistema</h4>

                    <table class="table mt-4">

                        <tr>
                            <th>Total de Escolas</th>
                            <td th:text="${dashboard.totalEscolas}">0</td>
                        </tr>

                        <tr>
                            <th>Escolas Ativas</th>
                            <td th:text="${dashboard.escolasAtivas}">0</td>
                        </tr>

                        <tr>
                            <th>Escolas Inativas</th>
                            <td th:text="${dashboard.escolasInativas}">0</td>
                        </tr>

                        <tr>
                            <th>Total de Usuários</th>
                            <td th:text="${dashboard.totalUsuarios}">0</td>
                        </tr>

                        <tr>
                            <th>Usuários Pendentes</th>
                            <td th:text="${dashboard.usuariosPendentes}">0</td>
                        </tr>

                    </table>

                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input"
                           type="checkbox"
                           id="status"
                           checked>
                    <label class="form-check-label" for="status">
                        Escola Ativa
                    </label>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
